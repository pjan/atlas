services:
  kometa:
    image: lscr.io/linuxserver/kometa:v2.4.8-ls117
    container_name: kometa
    restart: unless-stopped
    cap_drop:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
      - KOMETA_CONFIG=/config/config.yml
      - KOMETA_TIMES=${KOMETA_TIMES}
      - KOMETA_RUN=False
      - KOMETA_TESTS=False
      - KOMETA_NO_MISSING=False
      - KOMETA_PLEXTOKEN=${KOMETA_PLEXTOKEN:?KOMETA_PLEXTOKEN is required}
      - KOMETA_TMDBAPIKEY=${KOMETA_TMDBAPIKEY:?KOMETA_TMDBAPIKEY is required}
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?CONFIG_DIR is required}
        target: /config
        bind:
          create_host_path: false
    networks:
      - media_network
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

#################################
# NETWORK
#################################
networks:
  media_network:
    name: media_network
    external: true
