services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    restart: unless-stopped
    network_mode: "container:gluetun"
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
    volumes:
      - ${CONFIG_DIR}:/config
    mem_limit: 384m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ >/dev/null || wget -q --spider http://127.0.0.1:9696/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
