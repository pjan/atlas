services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: prowlarr
    restart: unless-stopped
    network_mode: "container:gluetun"
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
      # No login of its own: authentik forward auth is the gate (README "Arr
      # Authentication"); the validator requires it. The API still needs the key.
      - PROWLARR__AUTH__METHOD=External
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?CONFIG_DIR is required}
        target: /config
        bind:
          create_host_path: false
    mem_limit: 384m
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # /ping needs no API key and reports "OK" only while Prowlarr can query its database.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping | grep -E '\"status\"[[:space:]]*:[[:space:]]*\"OK\"' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
