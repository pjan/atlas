services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    restart: unless-stopped
    network_mode: "container:gluetun"
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?CONFIG_DIR is required}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_DIR:?DATA_DIR is required}
        target: /data
        bind:
          create_host_path: false
    mem_limit: 512m
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # /ping needs no API key and reports "OK" only while Radarr can query its database.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/ping | grep -E '\"status\"[[:space:]]*:[[:space:]]*\"OK\"' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
