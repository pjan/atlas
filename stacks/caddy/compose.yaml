services:
  caddy:
    # Built from ./Dockerfile by the caddy pre_deploy (README "Caddy"); the
    # local name keeps a pull from replacing it.
    build: .
    image: atlas-caddy:local
    container_name: caddy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_BIND_IP:?HTTP_BIND_IP is required}:${HTTP_PORT:?HTTP_PORT is required}:80"
      - "${HTTP_BIND_IP:?HTTP_BIND_IP is required}:443:443"
    # Port 8080 (the Cloudflare Tunnel's origin) is deliberately not published.
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN:?CLOUDFLARE_DNS_API_TOKEN is required}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: ./conf
        target: /etc/caddy
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy_network
      - rclone_network
      - youtarr_network
      - dispatcharr_network
      - monitoring_network
    mem_limit: 128m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy_network:
    name: proxy_network
    external: true
  rclone_network:
    name: rclone_network
    external: true
  youtarr_network:
    name: youtarr_network
    external: true
  dispatcharr_network:
    name: dispatcharr_network
    external: true
  monitoring_network:
    name: monitoring_network
    external: true

volumes:
  caddy-data:
  caddy-config:
