services:
  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_BIND_IP:?HTTP_BIND_IP is required}:${HTTP_PORT:?HTTP_PORT is required}:80"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: ./conf
        target: /etc/caddy
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy_network
      - rclone_network
    mem_limit: 128m
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy_network:
    name: proxy_network
    external: true
  rclone_network:
    name: rclone_network
    external: true

volumes:
  caddy-data:
  caddy-config:
