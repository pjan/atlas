services:
  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_BIND_IP}:${HTTP_PORT}:80"
    environment:
      - RCLONE_BASIC_AUTH_USER=${RCLONE_BASIC_AUTH_USER}
      - RCLONE_BASIC_AUTH_HASH=${RCLONE_BASIC_AUTH_HASH}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./conf:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy_network
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy_network:
    name: proxy_network
    external: true

volumes:
  caddy-data:
  caddy-config:
