services:
  sonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.18
    container_name: sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
    ports:
      - ${PORT}:8989
    volumes:
      - ${CONFIG_DIR}:/config
      - ${DATA_DIR}:/data
    networks:
      - media_network
      - proxy_network

#################################
# NETWORK
#################################
networks:
  media_network:
    name: media_network
    external: true
  proxy_network:
    name: proxy_network
    external: true
