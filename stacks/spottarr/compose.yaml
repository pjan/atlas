services:
  spottarr:
    image: spottarr/spottarr:1.20.0
    container_name: spottarr
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    network_mode: "container:gluetun"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - USENET__HOSTNAME=${SPOTTARR_USENET_HOSTNAME:?missing Spottarr Usenet hostname}
      - USENET__USERNAME=${SPOTTARR_USENET_USERNAME:?missing Spottarr Usenet username}
      - USENET__PASSWORD=${SPOTTARR_USENET_PASSWORD:?missing Spottarr Usenet password}
      - USENET__PORT=${SPOTTARR_USENET_PORT}
      - USENET__USETLS=${SPOTTARR_USENET_USE_TLS}
      - USENET__MAXCONNECTIONS=${SPOTTARR_USENET_MAX_CONNECTIONS}
      - SPOTNET__RETRIEVEAFTER=${SPOTTARR_SPOTNET_RETRIEVE_AFTER}
      - SPOTNET__IMPORTBATCHSIZE=${SPOTTARR_SPOTNET_IMPORT_BATCH_SIZE}
      - SPOTNET__RETENTIONDAYS=${SPOTTARR_SPOTNET_RETENTION_DAYS}
      - SPOTNET__IMPORTADULTCONTENT=${SPOTTARR_SPOTNET_IMPORT_ADULT_CONTENT}
      - NEWZNAB__APIKEY=${SPOTTARR_NEWZNAB_API_KEY:?missing Spottarr Newznab API key}
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?CONFIG_DIR is required}
        target: /data
        bind:
          create_host_path: false
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8383/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2h
