services:
  houndarr:
    image: ghcr.io/av1155/houndarr:v1.13.2
    container_name: houndarr
    restart: unless-stopped
    init: true
    user: "${PUID}:${PGID}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - HOUNDARR_LOG_LEVEL=info
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?CONFIG_DIR is required}
        target: /data
        bind:
          create_host_path: false
    expose:
      - "8877"
    networks:
      - media_network
      - proxy_network
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8877/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m

networks:
  media_network:
    name: media_network
    external: true
  proxy_network:
    name: proxy_network
    external: true
