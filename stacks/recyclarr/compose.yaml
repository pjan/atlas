services:
  recyclarr:
    image: recyclarr/recyclarr:8.7.2
    container_name: recyclarr
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - CRON_SCHEDULE=${CRON_SCHEDULE}
      - RECYCLARR_CONFIG_DIR=/config
      - RECYCLARR_DATA_DIR=/data
      - SONARR_URL=${SONARR_URL}
      - SONARR_API_KEY=${SONARR_API_KEY:?SONARR_API_KEY is required}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY:?RADARR_API_KEY is required}
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?CONFIG_DIR is required}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_DIR:?DATA_DIR is required}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./config/configs
        target: /config/configs
        read_only: true
        bind:
          create_host_path: false
    networks:
      - media_network
    # Healthy only if the newest real (non-preview) sync log finished without
    # errors in the last 26h (daily cron plus a slow-run margin). Startup
    # grace uses the entrypoint-written /tmp/crontab, recreated on every start.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          now=$$(date +%s); max=93600;
          for f in $$(ls -1t /data/logs/cli/*.debug.log 2>/dev/null); do
          if grep -qE '^\[[0-9:]+ (ERR|FTL)\]|result: Failed' "$$f"; then echo "sync failed: $$f"; exit 1; fi;
          if ! grep -q 'Cleaning up logs using max files' "$$f"; then pgrep -x recyclarr >/dev/null && continue; echo "sync did not finish: $$f"; exit 1; fi;
          grep -q 'State to path /config/state/' "$$f" || continue;
          if [ $$((now - $$(stat -c %Y "$$f"))) -lt $$max ]; then echo "last sync ok: $$f"; exit 0; fi;
          break;
          done;
          if [ $$((now - $$(stat -c %Y /tmp/crontab))) -lt $$max ]; then echo "no sync since start yet"; exit 0; fi;
          echo "no successful sync in 26h"; exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 384m
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

#################################
# NETWORK
#################################
networks:
  media_network:
    name: media_network
    external: true
