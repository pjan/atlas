services:
  recyclarr:
    image: recyclarr/recyclarr:8.7.2
    container_name: recyclarr
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - CRON_SCHEDULE=${CRON_SCHEDULE}
      - RECYCLARR_CONFIG_DIR=/config
      - RECYCLARR_DATA_DIR=/data
      - SONARR_URL=${SONARR_URL}
      - SONARR_API_KEY=${SONARR_API_KEY:?SONARR_API_KEY is required}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY:?RADARR_API_KEY is required}
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?CONFIG_DIR is required}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_DIR:?DATA_DIR is required}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./config/configs
        target: /config/configs
        read_only: true
        bind:
          create_host_path: false
    networks:
      - media_network
    mem_limit: 384m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

#################################
# NETWORK
#################################
networks:
  media_network:
    name: media_network
    external: true
