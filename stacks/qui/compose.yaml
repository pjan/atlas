services:
  qui:
    image: ghcr.io/autobrr/qui:v1.28.0
    container_name: qui
    restart: unless-stopped
    init: true
    user: "${PUID}:${PGID}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - UMASK=${UMASK}
      - QUI__HOST=0.0.0.0
      - QUI__PORT=7476
      - QUI__LOG_LEVEL=INFO
      - QUI__CHECK_FOR_UPDATES=false
      - QUI__DATABASE_ENGINE=sqlite
    volumes:
      - ${CONFIG_DIR}:/config
      - ${TORRENTS_DIR}:/data/downloads/torrents
    networks:
      - media_network
      - proxy_network
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7476/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

#################################
# NETWORK
#################################
networks:
  media_network:
    name: media_network
    external: true
  proxy_network:
    name: proxy_network
    external: true
