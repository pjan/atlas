# Prometheus, Alertmanager, exporters, and Grafana. Never stopped by the
# nightly backup Action, and its data (Prometheus TSDB, Alertmanager silences,
# Grafana SQLite) is not backed up: configuration lives in this repository and
# dashboards in the pjan/atlas-dashboards repository (Grafana Git Sync).
# Prometheus and blackbox reload their configuration automatically, and the
# stack restarts Grafana and reloads Alertmanager after deploy, because
# Resource Sync only runs `compose up -d` when a config file changes.

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --config.auto-reload
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=20GB
      - --web.listen-address=:9090
    environment:
      - TZ=${TZ}
    volumes:
      - type: bind
        source: ./prometheus
        target: /etc/prometheus
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PROMETHEUS_DATA_DIR:?PROMETHEUS_DATA_DIR is required}
        target: /prometheus
        bind:
          create_host_path: false
    expose:
      - "9090"
    networks:
      - monitoring_network
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Routes Prometheus alerts to Discord and the Watchdog to Healthchecks.io.
  # Both webhook URLs are Compose secrets fed by Komodo variables, which is
  # why this service cannot use a read-only root filesystem. post_deploy
  # reloads it with SIGHUP, which keeps the previous configuration if the new
  # one is invalid (a restart would crash-loop instead).
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    restart: unless-stopped
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --enable-feature=receiver-name-in-metrics
      - --web.listen-address=:9093
    environment:
      - TZ=${TZ}
    secrets:
      - discord_webhook_url
      - healthchecks_watchdog_url
    volumes:
      - type: bind
        source: ./alertmanager
        target: /etc/alertmanager
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ALERTMANAGER_DATA_DIR:?ALERTMANAGER_DATA_DIR is required}
        target: /alertmanager
        bind:
          create_host_path: false
    expose:
      - "9093"
    networks:
      - monitoring_network
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|volume2/@docker/.+)($$|/)
      - --web.listen-address=:9100
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${METRICS_DIR:?METRICS_DIR is required}
        target: /textfile
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "9100"
    networks:
      - monitoring_network
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0
    container_name: blackbox-exporter
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
      - --config.enable-auto-reload
      - --web.listen-address=:9115
    volumes:
      - type: bind
        source: ./blackbox
        target: /etc/blackbox_exporter
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "9115"
    networks:
      - monitoring_network
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The same probes, resolved through public DNS: probes of the Cloudflare path
  # (the public routes, authentik through the tunnel) must not follow Atlas'
  # own DNS for *.atlas.vandaele.io, which points at Caddy on the LAN.
  blackbox-public:
    image: prom/blackbox-exporter:v0.29.0
    container_name: blackbox-public
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
      - --config.enable-auto-reload
      - --web.listen-address=:9115
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - type: bind
        source: ./blackbox
        target: /etc/blackbox_exporter
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "9115"
    networks:
      - monitoring_network
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # SMART for every disk: sda (Seagate 12 TB, Volume 1), nvme0 (Lexar 512 GB,
  # Volume 2), nvme1 (TWSC 128 GB, UGOS system). Stable by-id names avoid
  # sdX/nvmeX reordering; recreate the stack after adding or replacing disks.
  # Root with only these devices plus SYS_RAWIO (SATA) and SYS_ADMIN (NVMe).
  # smartctl cannot infer the device type from by-id names, so each device
  # names its type after the semicolon (sat or nvme).
  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.15.0
    container_name: smartctl-exporter
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_RAWIO
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/disk/by-id/wwn-0x5000c500c81fb81d:/dev/disk/by-id/wwn-0x5000c500c81fb81d
      - /dev/disk/by-id/nvme-eui.0000000626012893caf25b0b330000ca:/dev/disk/by-id/nvme-eui.0000000626012893caf25b0b330000ca
      - /dev/disk/by-id/nvme-eui.00000000000000000c82d52610042585:/dev/disk/by-id/nvme-eui.00000000000000000c82d52610042585
    command:
      - --smartctl.device=/dev/disk/by-id/wwn-0x5000c500c81fb81d;sat
      - --smartctl.device=/dev/disk/by-id/nvme-eui.0000000626012893caf25b0b330000ca;nvme
      - --smartctl.device=/dev/disk/by-id/nvme-eui.00000000000000000c82d52610042585;nvme
      - --smartctl.interval=60s
      - --web.listen-address=:9633
    expose:
      - "9633"
    networks:
      - monitoring_network
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9633/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Per-container CPU, memory, block I/O, pressure (PSI), threads, start time,
  # and OOM events from the host cgroups only. There is deliberately no Docker
  # socket and no Docker root: those expose every container's environment.
  # Series therefore carry only the cgroup path; Prometheus derives
  # container_id from it, and the komodo_containers json-exporter module
  # supplies names, stacks, and health.
  # Root with only CAP_SYSLOG reads /dev/kmsg for OOM events
  # (kernel.dmesg_restrict=1 on UGOS).
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYSLOG
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/kmsg:/dev/kmsg:r
    command:
      - --docker_only=true
      - --raw_cgroup_prefix_whitelist=/system.slice/docker-
      - --store_container_labels=false
      - --housekeeping_interval=15s
      - --enable_metrics=cpu,memory,diskIO,oom_event,pressure,process
      - --port=8080
    volumes:
      - type: bind
        source: /sys/fs/cgroup
        target: /sys/fs/cgroup
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8080"
    networks:
      - monitoring_network
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # App exporters reach the VPN-bound applications through Gluetun's
  # downloaders-vpn alias on media_network. exportarr is distroless (no shell),
  # so Prometheus' up metric replaces a container healthcheck.
  exportarr-sonarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    container_name: exportarr-sonarr
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["sonarr"]
    environment:
      - PORT=9707
      - URL=http://downloaders-vpn:8989
      - API_KEY=${SONARR_API_KEY:?SONARR_API_KEY is required}
    expose:
      - "9707"
    networks:
      - media_network
      - monitoring_network
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  exportarr-radarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    container_name: exportarr-radarr
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["radarr"]
    environment:
      - PORT=9707
      - URL=http://downloaders-vpn:7878
      - API_KEY=${RADARR_API_KEY:?RADARR_API_KEY is required}
    expose:
      - "9707"
    networks:
      - media_network
      - monitoring_network
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  exportarr-lidarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    container_name: exportarr-lidarr
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["lidarr"]
    environment:
      - PORT=9707
      - URL=http://downloaders-vpn:8686
      - API_KEY=${LIDARR_API_KEY:?LIDARR_API_KEY is required}
    expose:
      - "9707"
    networks:
      - media_network
      - monitoring_network
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  exportarr-prowlarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    container_name: exportarr-prowlarr
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["prowlarr"]
    environment:
      - PORT=9707
      - URL=http://downloaders-vpn:9696
      - API_KEY=${PROWLARR_API_KEY:?PROWLARR_API_KEY is required}
    expose:
      - "9707"
    networks:
      - media_network
      - monitoring_network
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  exportarr-bazarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    container_name: exportarr-bazarr
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["bazarr"]
    environment:
      - PORT=9707
      - URL=http://downloaders-vpn:6767
      - API_KEY=${BAZARR_API_KEY:?BAZARR_API_KEY is required}
    expose:
      - "9707"
    networks:
      - media_network
      - monitoring_network
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  exportarr-sabnzbd:
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    container_name: exportarr-sabnzbd
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["sabnzbd"]
    environment:
      - PORT=9707
      - URL=http://downloaders-vpn:8085
      - API_KEY=${SABNZBD_API_KEY:?SABNZBD_API_KEY is required}
    expose:
      - "9707"
    networks:
      - media_network
      - monitoring_network
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Reads Gluetun, qBittorrent, slskd, and Komodo (stacks, containers, the
  # server, Actions, Procedures, the Resource Sync, updates, and alerts) APIs. Its keys come from
  # Komodo variables as Compose secrets under /run/secrets, which is why this
  # service cannot use a read-only root filesystem.
  json-exporter:
    image: prometheuscommunity/json-exporter:v0.8.0
    container_name: json-exporter
    restart: unless-stopped
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/json_exporter/json.yml
      - --web.listen-address=:7979
    secrets:
      - gluetun_api_key
      - qbittorrent_api_key
      - slskd_api_key
      - komodo_api_key
      - komodo_api_secret
    volumes:
      - type: bind
        source: ./json
        target: /etc/json_exporter
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "7979"
    networks:
      - media_network
      - monitoring_network
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:7979/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped
    user: "472:0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY:?GRAFANA_SECRET_KEY is required}
      # Encrypts secrets stored through the secrets manager, including the Git
      # Sync token. Its built-in default is public.
      - GF_SECRETS_MANAGER_ENCRYPTION_SECRET_KEY_V1_SECRET_KEY=${GRAFANA_SECRETS_MANAGER_KEY:?GRAFANA_SECRETS_MANAGER_KEY is required}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SERVER_ROOT_URL=https://grafana.atlas.vandaele.io
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_LOG_MODE=console
      - GF_DATABASE_TYPE=sqlite3
      - GF_DATABASE_WAL=true
      # Plugin versions come only from the pinned image. Grafana would otherwise
      # try to update bundled plugins at startup, which fails on the read-only
      # root filesystem and leaves the Prometheus plugin unregistered.
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
      # The Atlas theme plugin (grafana/plugins/atlas-theme-app) and State timeline plus
      # (grafana/plugins/pjan-statetimeline-panel, a pjan/grafana-plugins release) are not signed.
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=atlas-theme-app,pjan-statetimeline-panel
      # Login through authentik with OpenID Connect (README "authentik"; the
      # provider is stacks/authentik/blueprints/grafana.yaml). Users are matched
      # by username, never by email, which users can change in authentik.
      # Members of admins get the Admin role, everyone else Viewer. Grafana's
      # own login form stays until the authentik login is proven.
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET:?GRAFANA_OIDC_CLIENT_SECRET is required}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.atlas.vandaele.io/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.atlas.vandaele.io/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.atlas.vandaele.io/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - "GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups, 'admins') && 'Admin' || 'Viewer'"
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://auth.atlas.vandaele.io/application/o/grafana/end-session/
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN=true
    volumes:
      - type: bind
        source: ${GRAFANA_DATA_DIR:?GRAFANA_DATA_DIR is required}
        target: /var/lib/grafana
        bind:
          create_host_path: false
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./grafana/plugins/atlas-theme-app
        target: /var/lib/grafana/plugins/atlas-theme-app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./grafana/plugins/pjan-statetimeline-panel
        target: /var/lib/grafana/plugins/pjan-statetimeline-panel
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "3000"
    networks:
      - monitoring_network
      - proxy_network
    mem_limit: 512m
    cpus: 2
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  monitoring_network:
    name: monitoring_network
    external: true
  proxy_network:
    name: proxy_network
    external: true
  media_network:
    name: media_network
    external: true

secrets:
  gluetun_api_key:
    environment: GLUETUN_CONTROL_API_KEY
  qbittorrent_api_key:
    environment: QBITTORRENT_API_KEY
  slskd_api_key:
    environment: SLSKD_API_KEY
  komodo_api_key:
    environment: KOMODO_MONITORING_API_KEY
  komodo_api_secret:
    environment: KOMODO_MONITORING_API_SECRET
  discord_webhook_url:
    environment: DISCORD_ALERTS_WEBHOOK_URL
  healthchecks_watchdog_url:
    environment: HEALTHCHECKS_WATCHDOG_PING_URL
