# promtool tests for rules/services.yml: each service and container alert fires and turns
# its check red or amber, stays quiet otherwise, and (where gated) stays
# quiet during the appdata backup. Run by scripts/validate.sh. Outside
# prometheus/, so Prometheus never loads these files.

rule_files:
  - ../prometheus/rules/rag.yml
  - ../prometheus/rules/services.yml
  - ../prometheus/rules/containers.yml

evaluation_interval: 30s

tests:
  # Caddy's metrics endpoint stops answering at 5m; its LAN port stays up.
  - name: caddy down
    interval: 1m
    input_series:
      - series: 'up{job="caddy", instance="caddy:2020"}'
        values: '1x4 0x10'
      - series: 'probe_success{job="probe_tcp", instance="192.168.2.200:80", service="caddy"}'
        values: '1x14'
    alert_rule_test:
      - eval_time: 7m
        alertname: CaddyDown
        exp_alerts: []
      - eval_time: 9m
        alertname: CaddyDown
        exp_alerts:
          - exp_labels:
              alertname: CaddyDown
              check: services.caddy
              severity: critical
              source: prometheus
              job: caddy
              instance: caddy:2020
            exp_annotations:
              title: Caddy down
              description: Caddy is not answering, or its HTTPS listener has no valid certificate, so the *.atlas.vandaele.io routes are down on the LAN, and on the tunnel too unless only the certificate failed. Check the caddy stack and its logs in Komodo and redeploy it.
              target: caddy:2020
              details: caddy = 0
              link: https://komodo.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
              runbook: https://github.com/pjan/atlas#caddy
    promql_expr_test:
      - expr: atlas:check_status{check="services.caddy"}
        eval_time: 7m
        exp_samples:
          - labels: 'atlas:check_status{check="services.caddy"}'
            value: 0
      - expr: atlas:check_status{check="services.caddy"}
        eval_time: 9m
        exp_samples:
          - labels: 'atlas:check_status{check="services.caddy"}'
            value: 2

  # The certificate has 10 days and 1 hour left at 0m, so under 10 days
  # from 1h; the handshake keeps succeeding. Amber, never red.
  - name: caddy certificate expiring
    interval: 5m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="probe_tls_caddy", instance="192.168.2.200:443", service="caddy"}'
        values: '867600x30'
      - series: 'probe_success{job="probe_tls_caddy", instance="192.168.2.200:443", service="caddy"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 1h25m
        alertname: CaddyCertificateExpiring
        exp_alerts: []
      - eval_time: 2h
        alertname: CaddyCertificateExpiring
        exp_alerts:
          - exp_labels:
              alertname: CaddyCertificateExpiring
              check: services.caddy
              severity: warning
              source: prometheus
              job: probe_tls_caddy
              instance: 192.168.2.200:443
              service: caddy
            exp_annotations:
              title: Caddy certificate expiring
              description: Caddy's *.atlas.vandaele.io certificate expires within 10 days, so renewals through the Cloudflare DNS challenge are failing. Check the caddy logs and CLOUDFLARE_DNS_API_TOKEN in Komodo, then redeploy caddy.
              target: 192.168.2.200:443
              details: 9d 23h 0m 0s left
              link: https://komodo.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
              runbook: https://github.com/pjan/atlas#caddy
      - eval_time: 2h
        alertname: CaddyDown
        exp_alerts: []
    promql_expr_test:
      - expr: atlas:check_status{check="services.caddy"}
        eval_time: 2h
        exp_samples:
          - labels: 'atlas:check_status{check="services.caddy"}'
            value: 1

  # The TLS handshake on :443 fails from 5m (no valid certificate) while
  # Caddy's metrics and port 80 stay up: CaddyDown, red.
  - name: caddy certificate invalid
    interval: 1m
    input_series:
      - series: 'up{job="caddy", instance="caddy:2020"}'
        values: '1x14'
      - series: 'probe_success{job="probe_tcp", instance="192.168.2.200:80", service="caddy"}'
        values: '1x14'
      - series: 'probe_success{job="probe_tls_caddy", instance="192.168.2.200:443", service="caddy"}'
        values: '1x4 0x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: CaddyDown
        exp_alerts: []
      - eval_time: 9m
        alertname: CaddyDown
        exp_alerts:
          - exp_labels:
              alertname: CaddyDown
              check: services.caddy
              severity: critical
              source: prometheus
              job: probe_tls_caddy
              instance: 192.168.2.200:443
              service: caddy
            exp_annotations:
              title: Caddy down
              description: Caddy is not answering, or its HTTPS listener has no valid certificate, so the *.atlas.vandaele.io routes are down on the LAN, and on the tunnel too unless only the certificate failed. Check the caddy stack and its logs in Komodo and redeploy it.
              target: 192.168.2.200:443
              details: probe_tls_caddy = 0
              link: https://komodo.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
              runbook: https://github.com/pjan/atlas#caddy
    promql_expr_test:
      - expr: atlas:check_status{check="services.caddy"}
        eval_time: 9m
        exp_samples:
          - labels: 'atlas:check_status{check="services.caddy"}'
            value: 2

  # sonarr's public route through the Cloudflare Tunnel fails from 2m (for
  # example a DNS record that no longer points at the tunnel); its LAN health
  # probe stays up.
  - name: public route failed
    interval: 1m
    input_series:
      - series: 'probe_success{job="probe_routes_public", instance="https://sonarr.atlas.vandaele.io", module="http_route", service="sonarr-public"}'
        values: '1 1 0x12'
      - series: 'probe_success{job="probe_health", instance="https://sonarr.atlas.vandaele.io/ping", module="http_servarr_ping", service="sonarr"}'
        values: '1x13'
    alert_rule_test:
      - eval_time: 6m
        alertname: ProbeFailed
        exp_alerts: []
      - eval_time: 8m
        alertname: ProbeFailed
        exp_alerts:
          - exp_labels:
              alertname: ProbeFailed
              check: services.apps
              severity: warning
              source: prometheus
              job: probe_routes_public
              instance: https://sonarr.atlas.vandaele.io
              module: http_route
              service: sonarr-public
            exp_annotations:
              title: Probe failed · sonarr-public
              description: sonarr-public has not answered its health check for 5 minutes. Check the stack and its logs in Komodo and redeploy it if it does not recover.
              target: sonarr-public
              details: https://sonarr.atlas.vandaele.io (http_route)
              link: https://sonarr.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
              runbook: https://github.com/pjan/atlas#application-probes

  # sonarr and Caddy's own health probe fail from 2m, Plex's direct probe
  # from 4m. Caddy's probe is left to CaddyDown; Plex is critical.
  - name: probe failed
    interval: 1m
    input_series:
      - series: 'probe_success{job="probe_health", instance="https://sonarr.atlas.vandaele.io/ping", module="http_servarr_ping", service="sonarr"}'
        values: '1 1 0x12'
      - series: 'probe_success{job="probe_health", instance="https://caddy.atlas.vandaele.io/", module="http_caddy_ok", service="caddy"}'
        values: '1 1 0x12'
      - series: 'probe_success{job="probe_health", instance="https://radarr.atlas.vandaele.io/ping", module="http_servarr_ping", service="radarr"}'
        values: '1x13'
      - series: 'probe_success{job="probe_health", instance="http://192.168.2.200:32400/identity", module="http_plex_identity", service="plex-direct"}'
        values: '1x3 0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ProbeFailed
        exp_alerts: []
      - eval_time: 8m
        alertname: ProbeFailed
        exp_alerts:
          - exp_labels:
              alertname: ProbeFailed
              check: services.apps
              severity: warning
              source: prometheus
              job: probe_health
              instance: https://sonarr.atlas.vandaele.io/ping
              module: http_servarr_ping
              service: sonarr
            exp_annotations:
              title: Probe failed · sonarr
              description: sonarr has not answered its health check for 5 minutes. Check the stack and its logs in Komodo and redeploy it if it does not recover.
              target: sonarr
              details: https://sonarr.atlas.vandaele.io/ping (http_servarr_ping)
              link: https://sonarr.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
              runbook: https://github.com/pjan/atlas#application-probes
      - eval_time: 10m
        alertname: ProbeFailed
        exp_alerts:
          - exp_labels:
              alertname: ProbeFailed
              check: services.apps
              severity: warning
              source: prometheus
              job: probe_health
              instance: https://sonarr.atlas.vandaele.io/ping
              module: http_servarr_ping
              service: sonarr
            exp_annotations:
              title: Probe failed · sonarr
              description: sonarr has not answered its health check for 5 minutes. Check the stack and its logs in Komodo and redeploy it if it does not recover.
              target: sonarr
              details: https://sonarr.atlas.vandaele.io/ping (http_servarr_ping)
              link: https://sonarr.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
              runbook: https://github.com/pjan/atlas#application-probes
          - exp_labels:
              alertname: ProbeFailed
              check: services.apps
              severity: critical
              source: prometheus
              job: probe_health
              instance: http://192.168.2.200:32400/identity
              module: http_plex_identity
              service: plex-direct
            exp_annotations:
              title: Probe failed · plex-direct
              description: Plex has not answered its health check (plex-direct) for 5 minutes, so streaming is down. Check the plex stack and its logs in Komodo and redeploy it if it does not recover.
              target: plex-direct
              details: http://192.168.2.200:32400/identity (http_plex_identity)
              link: http://192.168.2.200:32400
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
              runbook: https://github.com/pjan/atlas#application-probes
    promql_expr_test:
      - expr: atlas:check_status{check="services.apps"}
        eval_time: 5m
        exp_samples:
          - labels: 'atlas:check_status{check="services.apps"}'
            value: 0
      - expr: atlas:check_status{check="services.apps"}
        eval_time: 8m
        exp_samples:
          - labels: 'atlas:check_status{check="services.apps"}'
            value: 1
      - expr: atlas:check_status{check="services.apps"}
        eval_time: 10m
        exp_samples:
          - labels: 'atlas:check_status{check="services.apps"}'
            value: 2

  # The nightly backup: `backup check` at 0m, `backup run` at 30m. The
  # stopped stacks fail their probes and report `stopped` until 40m, and
  # nothing fires. Caddy is gated too.
  - name: services gated during the backup
    interval: 1m
    input_series:
      - series: 'atlas_backup_last_run_timestamp_seconds{job="node", instance="atlas", set="appdata", mode="check"}'
        values: '0x29 stale'
      - series: 'atlas_backup_last_run_timestamp_seconds{job="node", instance="atlas", set="appdata", mode="run"}'
        values: '_x30 1800x30'
      - series: 'probe_success{job="probe_health", instance="https://sonarr.atlas.vandaele.io/ping", module="http_servarr_ping", service="sonarr"}'
        values: '1 0x39 1x20'
      - series: 'probe_success{job="probe_health", instance="https://plex.atlas.vandaele.io/identity", module="http_plex_identity", service="plex"}'
        values: '1 0x39 1x20'
      - series: 'komodo_stack_info{job="json_apis", instance="http://192.168.2.200:9120/read/ListStacks", module="komodo_stacks", service="komodo", stack="sonarr", state="stopped"}'
        values: '_ 1x39 stale'
      - series: 'komodo_stack_info{job="json_apis", instance="http://192.168.2.200:9120/read/ListStacks", module="komodo_stacks", service="komodo", stack="sonarr", state="running"}'
        values: '1 stale _x38 1x20'
      - series: 'up{job="caddy", instance="caddy:2020"}'
        values: '1 0x10 1x49'
    alert_rule_test:
      - eval_time: 20m
        alertname: ProbeFailed
        exp_alerts: []
      - eval_time: 38m
        alertname: StackUnhealthy
        exp_alerts: []
      - eval_time: 10m
        alertname: CaddyDown
        exp_alerts: []
      - eval_time: 55m
        alertname: ProbeFailed
        exp_alerts: []
    promql_expr_test:
      - expr: atlas:check_status{check="services.apps"}
        eval_time: 38m
        exp_samples:
          - labels: 'atlas:check_status{check="services.apps"}'
            value: 0
      - expr: atlas:check_status{check="stacks.health"}
        eval_time: 38m
        exp_samples:
          - labels: 'atlas:check_status{check="stacks.health"}'
            value: 0

  # cloudflared loses its connections at 2m; its metrics disappear at 12m.
  - name: tunnel down
    interval: 1m
    input_series:
      - series: 'cloudflared_tunnel_ha_connections{job="cloudflared", instance="cloudflared:2000"}'
        values: '4 4 0x9 stale'
    alert_rule_test:
      - eval_time: 5m
        alertname: TunnelDown
        exp_alerts: []
      - eval_time: 8m
        alertname: TunnelDown
        exp_alerts:
          - exp_labels:
              alertname: TunnelDown
              check: services.tunnel
              severity: critical
              source: prometheus
            exp_annotations:
              title: Cloudflare tunnel down
              description: cloudflared has no connection to Cloudflare, or its metrics are missing, so the public *.atlas.vandaele.io hostnames are down. Check the cloudflared stack and its logs in Komodo.
              target: cloudflared
              details: ha_connections = 0
              link: https://komodo.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
              runbook: https://github.com/pjan/atlas#cloudflare-tunnel
      - eval_time: 20m
        alertname: TunnelDown
        exp_alerts:
          - exp_labels:
              alertname: TunnelDown
              check: services.tunnel
              severity: critical
              source: prometheus
            exp_annotations:
              title: Cloudflare tunnel down
              description: cloudflared has no connection to Cloudflare, or its metrics are missing, so the public *.atlas.vandaele.io hostnames are down. Check the cloudflared stack and its logs in Komodo.
              target: cloudflared
              details: no cloudflared_tunnel_ha_connections
              link: https://komodo.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
              runbook: https://github.com/pjan/atlas#cloudflare-tunnel
    promql_expr_test:
      - expr: atlas:check_status{check="services.tunnel"}
        eval_time: 5m
        exp_samples:
          - labels: 'atlas:check_status{check="services.tunnel"}'
            value: 0
      - expr: atlas:check_status{check="services.tunnel"}
        eval_time: 8m
        exp_samples:
          - labels: 'atlas:check_status{check="services.tunnel"}'
            value: 2

  # seerr turns unhealthy at 2m; appdata-backup is down (never deployed).
  - name: stack unhealthy
    interval: 1m
    input_series:
      - series: 'komodo_stack_info{job="json_apis", instance="http://192.168.2.200:9120/read/ListStacks", module="komodo_stacks", service="komodo", stack="seerr", state="running"}'
        values: '1 1 stale'
      - series: 'komodo_stack_info{job="json_apis", instance="http://192.168.2.200:9120/read/ListStacks", module="komodo_stacks", service="komodo", stack="seerr", state="unhealthy"}'
        values: '_ _ 1x20'
      - series: 'komodo_stack_info{job="json_apis", instance="http://192.168.2.200:9120/read/ListStacks", module="komodo_stacks", service="komodo", stack="appdata-backup", state="down"}'
        values: '1x22'
    alert_rule_test:
      - eval_time: 10m
        alertname: StackUnhealthy
        exp_alerts: []
      - eval_time: 18m
        alertname: StackUnhealthy
        exp_alerts:
          - exp_labels:
              alertname: StackUnhealthy
              check: stacks.health
              severity: warning
              source: komodo
              job: json_apis
              instance: http://192.168.2.200:9120/read/ListStacks
              module: komodo_stacks
              service: komodo
              stack: seerr
              state: unhealthy
            exp_annotations:
              title: Stack unhealthy · seerr
              description: Komodo has reported the seerr stack as unhealthy for 15 minutes. Open it in Komodo, check its containers and logs, and deploy it again.
              target: seerr
              details: state = unhealthy
              link: https://komodo.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
              runbook: https://github.com/pjan/atlas#stack-health
    promql_expr_test:
      - expr: atlas:check_status{check="stacks.health"}
        eval_time: 10m
        exp_samples:
          - labels: 'atlas:check_status{check="stacks.health"}'
            value: 0
      - expr: atlas:check_status{check="stacks.health"}
        eval_time: 18m
        exp_samples:
          - labels: 'atlas:check_status{check="stacks.health"}'
            value: 1

  # seerr is unhealthy from 0; sonarr is healthy. Firing after 10 minutes.
  - name: container unhealthy
    interval: 1m
    input_series:
      - series: 'komodo_container_info{job="json_apis", container="seerr", container_id="aaaa", stack="seerr", compose_service="seerr", stack_id="s1", state="running", health="unhealthy", image="seerr:1"}'
        values: '1x20'
      - series: 'komodo_container_info{job="json_apis", container="sonarr", container_id="bbbb", stack="sonarr", compose_service="sonarr", stack_id="s2", state="running", health="healthy", image="sonarr:4"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: ContainerUnhealthy
        exp_alerts: []
      - eval_time: 11m
        alertname: ContainerUnhealthy
        exp_alerts:
          - exp_labels:
              alertname: ContainerUnhealthy
              check: containers.health
              severity: warning
              source: komodo
              container: seerr
              stack: seerr
            exp_annotations:
              title: Container unhealthy · seerr
              description: Docker has reported the seerr container of the seerr stack as unhealthy for 10 minutes. Docker does not restart it; check its logs and healthcheck, then restart the stack in Komodo.
              target: seerr · seerr
              details: health = unhealthy
              link: https://komodo.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-containers
              runbook: https://github.com/pjan/atlas#container-health
    promql_expr_test:
      - expr: atlas:check_status{check="containers.health"}
        eval_time: 11m
        exp_samples:
          - labels: 'atlas:check_status{check="containers.health"}'
            value: 1

  # The same during the appdata backup (backup check at 0): gated.
  - name: container unhealthy during the backup
    interval: 1m
    input_series:
      - series: 'atlas_backup_last_run_timestamp_seconds{set="appdata", mode="check"}'
        values: '0x20'
      - series: 'komodo_container_info{job="json_apis", container="seerr", container_id="aaaa", stack="seerr", compose_service="seerr", stack_id="s1", state="running", health="unhealthy", image="seerr:1"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ContainerUnhealthy
        exp_alerts: []

  # radarr flips between restarting and running every minute from 0.
  - name: container crash loop (restarting)
    interval: 1m
    input_series:
      - series: 'komodo_container_info{job="json_apis", container="radarr", container_id="aaaa", stack="radarr", compose_service="radarr", stack_id="s1", state="restarting", image="radarr:5"}'
        values: '1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _'
      - series: 'komodo_container_info{job="json_apis", container="radarr", container_id="aaaa", stack="radarr", compose_service="radarr", stack_id="s1", state="running", image="radarr:5"}'
        values: '_ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: ContainerCrashLooping
        exp_alerts: []
      - eval_time: 6m
        alertname: ContainerCrashLooping
        exp_alerts:
          - exp_labels:
              alertname: ContainerCrashLooping
              check: containers.crashloop
              severity: warning
              source: prometheus
              container: radarr
              stack: radarr
            exp_annotations:
              title: Container crash looping · radarr
              description: The radarr container of the radarr stack keeps exiting and Docker keeps restarting it. Read its logs in Komodo, fix the cause, and deploy the stack again.
              target: radarr · radarr
              details: restarting in the last 10 minutes, or 3 or more unexpected restarts in 15 minutes
              link: https://komodo.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-containers
              runbook: https://github.com/pjan/atlas#container-crash-loop
    promql_expr_test:
      - expr: atlas:check_status{check="containers.crashloop"}
        eval_time: 6m
        exp_samples:
          - labels: 'atlas:check_status{check="containers.crashloop"}'
            value: 1

  # radarr restarts every 2 minutes from 2m without a Komodo operation (each
  # restart counts 2 minutes later): the third counts at 8m, firing at 13m.
  - name: container crash loop (restarts)
    interval: 1m
    input_series:
      - series: 'container_start_time_seconds{container_id="aaaa", id="/system.slice/docker-aaaa.scope"}'
        values: '100 100 200 200 300 300 400 400 500 500 600 600 700 700 800 800 900 900 1000 1000'
      - series: 'komodo_container_info{job="json_apis", container="radarr", container_id="aaaa", stack="radarr", compose_service="radarr", stack_id="s1", state="running", image="radarr:5"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: ContainerCrashLooping
        exp_alerts: []
      - eval_time: 14m
        alertname: ContainerCrashLooping
        exp_alerts:
          - exp_labels:
              alertname: ContainerCrashLooping
              check: containers.crashloop
              severity: warning
              source: prometheus
              container: radarr
              stack: radarr
            exp_annotations:
              title: Container crash looping · radarr
              description: The radarr container of the radarr stack keeps exiting and Docker keeps restarting it. Read its logs in Komodo, fix the cause, and deploy the stack again.
              target: radarr · radarr
              details: restarting in the last 10 minutes, or 3 or more unexpected restarts in 15 minutes
              link: https://komodo.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-containers
              runbook: https://github.com/pjan/atlas#container-crash-loop

  # One OOM kill at 6m; firing at once, resolved 15 minutes later.
  - name: container OOM kill
    interval: 1m
    input_series:
      - series: 'node_vmstat_oom_kill{instance="node-exporter:9100", job="node"}'
        values: '0x5 1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: ContainerOOMKilled
        exp_alerts: []
      - eval_time: 12m
        alertname: ContainerOOMKilled
        exp_alerts:
          - exp_labels:
              alertname: ContainerOOMKilled
              check: containers.oom
              severity: warning
              source: prometheus
            exp_annotations:
              title: Out-of-memory kill on Atlas
              description: The kernel killed a process for lack of memory in the last 15 minutes, usually a container at its mem_limit. Find it in the OOM column on Atlas Containers, then raise its mem_limit or fix its leak.
              target: Atlas
              details: 1 OOM kills in 15 minutes
              link: https://komodo.atlas.vandaele.io
              dashboard: https://grafana.atlas.vandaele.io/d/atlas-containers
              runbook: https://github.com/pjan/atlas#container-oom-kill
      - eval_time: 25m
        alertname: ContainerOOMKilled
        exp_alerts: []
    promql_expr_test:
      - expr: atlas:check_status{check="containers.oom"}
        eval_time: 12m
        exp_samples:
          - labels: 'atlas:check_status{check="containers.oom"}'
            value: 1
