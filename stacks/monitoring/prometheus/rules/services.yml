# Service alerts: Caddy, the application health probes, the Cloudflare
# tunnel, the Komodo stack states, and container health, crash loops, and
# OOM kills. Rules affected by stacks the appdata backup stops are gated
# with `unless on () atlas:maintenance == 1`.
# Inhibitions are in alertmanager.yml. Tests: stacks/monitoring/prometheus-tests/.

groups:
  - name: services
    rules:
      # Caddy's own metrics endpoint on the Docker network, its LAN port, and
      # its HTTPS listener with a valid certificate (job probe_tls_caddy), none
      # through DNS. Inhibits ProbeFailed except plex-direct and authentik.
      - alert: CaddyDown
        expr: |
          (
              up{job="caddy"} == 0
            or
              probe_success{job="probe_tcp", service="caddy"} == 0
            or
              probe_success{job="probe_tls_caddy"} == 0
          )
          unless on () atlas:maintenance == 1
        for: 3m
        labels:
          check: services.caddy
          severity: critical
          source: prometheus
        annotations:
          title: Caddy down
          description: Caddy is not answering, or its HTTPS listener has no valid certificate, so the *.atlas.vandaele.io routes are down on the LAN, and on the tunnel too unless only the certificate failed. Check the caddy stack and its logs in Komodo and redeploy it.
          target: "{{ $labels.instance }}"
          details: "{{ $labels.job }} = 0"
          link: https://komodo.atlas.vandaele.io
          dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
          runbook: https://github.com/pjan/atlas#caddy

      # Caddy's *.atlas.vandaele.io certificate on :443 (job probe_tls_caddy)
      # has under 10 days left. Caddy renews with a third of the lifetime left
      # (30 days of 90), so renewals have failed for days. No valid certificate
      # at all is CaddyDown.
      - alert: CaddyCertificateExpiring
        expr: |
          probe_ssl_earliest_cert_expiry{job="probe_tls_caddy"} - time() < 10 * 86400
          unless on () atlas:maintenance == 1
        for: 30m
        labels:
          check: services.caddy
          severity: warning
          source: prometheus
        annotations:
          title: Caddy certificate expiring
          description: Caddy's *.atlas.vandaele.io certificate expires within 10 days, so renewals through the Cloudflare DNS challenge are failing. Check the caddy logs and CLOUDFLARE_DNS_API_TOKEN in Komodo, then redeploy caddy.
          target: "{{ $labels.instance }}"
          details: "{{ $value | humanizeDuration }} left"
          link: https://komodo.atlas.vandaele.io
          dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
          runbook: https://github.com/pjan/atlas#caddy

      # Application health endpoints (job probe_health) and the public routes
      # through the Cloudflare Tunnel (job probe_routes_public, services
      # <app>-public). Caddy's own health probe is left to CaddyDown; Plex has
      # the critical rule below.
      - alert: ProbeFailed
        expr: |
          probe_success{job=~"probe_health|probe_routes_public", service!~"caddy|plex|plex-direct"} == 0
          unless on () atlas:maintenance == 1
        for: 5m
        labels:
          check: services.apps
          severity: warning
          source: prometheus
        annotations:
          title: Probe failed · {{ $labels.service }}
          description: "{{ $labels.service }} has not answered its health check for 5 minutes. Check the stack and its logs in Komodo and redeploy it if it does not recover."
          target: "{{ $labels.service }}"
          details: "{{ $labels.instance }} ({{ $labels.module }})"
          link: '{{ reReplaceAll "^(https?://[^/]+).*$" "$1" $labels.instance }}'
          dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
          runbook: https://github.com/pjan/atlas#application-probes

      - alert: ProbeFailed
        expr: |
          probe_success{job="probe_health", service=~"plex|plex-direct"} == 0
          unless on () atlas:maintenance == 1
        for: 5m
        labels:
          check: services.apps
          severity: critical
          source: prometheus
        annotations:
          title: Probe failed · {{ $labels.service }}
          description: "Plex has not answered its health check ({{ $labels.service }}) for 5 minutes, so streaming is down. Check the plex stack and its logs in Komodo and redeploy it if it does not recover."
          target: "{{ $labels.service }}"
          details: "{{ $labels.instance }} ({{ $labels.module }})"
          link: '{{ reReplaceAll "^(https?://[^/]+).*$" "$1" $labels.instance }}'
          dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
          runbook: https://github.com/pjan/atlas#application-probes

      # Not gated: cloudflared is never stopped. Also fires when its metrics
      # are missing (cloudflared is not in MonitoringTargetDown).
      - alert: TunnelDown
        expr: (max(cloudflared_tunnel_ha_connections) or vector(0)) == 0
        for: 5m
        labels:
          check: services.tunnel
          severity: critical
          source: prometheus
        annotations:
          title: Cloudflare tunnel down
          description: cloudflared has no connection to Cloudflare, or its metrics are missing, so the public *.atlas.vandaele.io hostnames are down. Check the cloudflared stack and its logs in Komodo.
          target: cloudflared
          details: '{{ with query "cloudflared_tunnel_ha_connections" }}ha_connections = 0{{ else }}no cloudflared_tunnel_ha_connections{{ end }}'
          link: https://komodo.atlas.vandaele.io
          dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
          runbook: https://github.com/pjan/atlas#cloudflare-tunnel

      # Komodo stack states (json_apis). down means not deployed (for example
      # appdata-backup); stopped during the backup is gated.
      - alert: StackUnhealthy
        expr: |
          komodo_stack_info{state!~"running|down"}
          unless on () atlas:maintenance == 1
        for: 15m
        labels:
          check: stacks.health
          severity: warning
          source: komodo
        annotations:
          title: Stack unhealthy · {{ $labels.stack }}
          description: Komodo has reported the {{ $labels.stack }} stack as {{ $labels.state }} for 15 minutes. Open it in Komodo, check its containers and logs, and deploy it again.
          target: "{{ $labels.stack }}"
          details: "state = {{ $labels.state }}"
          link: https://komodo.atlas.vandaele.io
          dashboard: https://grafana.atlas.vandaele.io/d/atlas-health
          runbook: https://github.com/pjan/atlas#stack-health

      # Docker health (json_apis, from the container status). Komodo's stack
      # state ignores health, so StackUnhealthy does not cover this. Gated:
      # stacks the backup starts again report health: starting first.
      - alert: ContainerUnhealthy
        expr: |
          max by (container, stack) (komodo_container_info{state="running", health="unhealthy"})
          unless on () atlas:maintenance == 1
        for: 10m
        labels:
          check: containers.health
          severity: warning
          source: komodo
        annotations:
          title: Container unhealthy · {{ $labels.container }}
          description: Docker has reported the {{ $labels.container }} container of the {{ $labels.stack }} stack as unhealthy for 10 minutes. Docker does not restart it; check its logs and healthcheck, then restart the stack in Komodo.
          target: "{{ $labels.stack }} · {{ $labels.container }}"
          details: health = unhealthy
          link: https://komodo.atlas.vandaele.io
          dashboard: https://grafana.atlas.vandaele.io/d/atlas-containers
          runbook: https://github.com/pjan/atlas#container-health

      # A crash loop: Docker's restart policy restarting the container (the
      # state flips between restarting and running, so any restarting in 10
      # minutes counts), or 3 unexpected restarts in 15 minutes. It makes the
      # stack restarting or unhealthy, so it inhibits StackUnhealthy for the
      # same stack (alertmanager.yml). Gated.
      - alert: ContainerCrashLooping
        expr: |
          (
              max by (container, stack) (max_over_time(komodo_container_info{state="restarting"}[10m]))
            or
              max by (container, stack) (sum_over_time(atlas:container_restarted_unexpectedly[15m])) >= 3
          )
          unless on () atlas:maintenance == 1
        for: 5m
        labels:
          check: containers.crashloop
          severity: warning
          source: prometheus
        annotations:
          title: Container crash looping · {{ $labels.container }}
          description: The {{ $labels.container }} container of the {{ $labels.stack }} stack keeps exiting and Docker keeps restarting it. Read its logs in Komodo, fix the cause, and deploy the stack again.
          target: "{{ $labels.stack }} · {{ $labels.container }}"
          details: restarting in the last 10 minutes, or 3 or more unexpected restarts in 15 minutes
          link: https://komodo.atlas.vandaele.io
          dashboard: https://grafana.atlas.vandaele.io/d/atlas-containers
          runbook: https://github.com/pjan/atlas#container-crash-loop

      # node-exporter's count of kernel OOM kills (/proc/vmstat oom_kill),
      # including kills at a container's mem_limit. cAdvisor's per-container
      # counter misses kills whose container is gone, so it only names the
      # container on Atlas Containers. Not gated: the backup does not cause
      # OOM kills. Resolves 15 minutes after the last kill.
      - alert: ContainerOOMKilled
        expr: |
          sum(increase(node_vmstat_oom_kill[15m])) > 0
        labels:
          check: containers.oom
          severity: warning
          source: prometheus
        annotations:
          title: Out-of-memory kill on Atlas
          description: The kernel killed a process for lack of memory in the last 15 minutes, usually a container at its mem_limit. Find it in the OOM column on Atlas Containers, then raise its mem_limit or fix its leak.
          target: Atlas
          details: '{{ printf "%.0f" $value }} OOM kills in 15 minutes'
          link: https://komodo.atlas.vandaele.io
          dashboard: https://grafana.atlas.vandaele.io/d/atlas-containers
          runbook: https://github.com/pjan/atlas#container-oom-kill
