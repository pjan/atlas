# Prometheus configuration for Atlas. Reloaded automatically (--config.auto-reload).
# Never put secrets in this file; use *_file settings with /run/secrets instead.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    instance_group: atlas

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: atlas

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: smartctl
    scrape_interval: 60s
    static_configs:
      - targets: ["smartctl-exporter:9633"]
        labels:
          instance: atlas

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2020"]

  - job_name: cloudflared
    static_configs:
      - targets: ["cloudflared:2000"]

  - job_name: unpackerr
    static_configs:
      - targets: ["unpackerr:5656"]

  # Application exporters (API keys from Komodo variables).
  - job_name: exportarr
    scrape_interval: 2m
    scrape_timeout: 90s
    static_configs:
      - targets: ["exportarr-radarr:9707"]
        labels: {app: radarr}
      - targets: ["exportarr-lidarr:9707"]
        labels: {app: lidarr}
      - targets: ["exportarr-prowlarr:9707"]
        labels: {app: prowlarr}
      - targets: ["exportarr-sabnzbd:9707"]
        labels: {app: sabnzbd}

  # Sonarr and Bazarr are slower to query.
  - job_name: exportarr_slow
    scrape_interval: 5m
    scrape_timeout: 2m
    static_configs:
      - targets: ["exportarr-sonarr:9707"]
        labels: {app: sonarr}
      - targets: ["exportarr-bazarr:9707"]
        labels: {app: bazarr}

  - job_name: qbittorrent
    scrape_interval: 60s
    static_configs:
      - targets: ["qbittorrent-exporter:8000"]

  - job_name: json_exporter
    static_configs:
      - targets: ["json-exporter:7979"]

  # JSON APIs through json_exporter; each target selects its module.
  - job_name: json_apis
    scrape_interval: 60s
    metrics_path: /probe
    static_configs:
      - targets: ["http://downloaders-vpn:8000/v1/vpn/status"]
        labels: {module: gluetun_vpn_status, service: gluetun}
      - targets: ["http://downloaders-vpn:8000/v1/publicip/ip"]
        labels: {module: gluetun_public_ip, service: gluetun}
      - targets: ["http://downloaders-vpn:8000/v1/portforward"]
        labels: {module: gluetun_port_forward, service: gluetun}
      - targets: ["http://downloaders-vpn:8080/api/v2/app/preferences"]
        labels: {module: qbittorrent_preferences, service: qbittorrent}
      - targets: ["http://downloaders-vpn:5030/api/v0/server"]
        labels: {module: slskd_server, service: slskd}
      - targets: ["http://192.168.2.200:9120/read/ListStacks"]
        labels: {module: komodo_stacks, service: komodo}
    relabel_configs:
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: json-exporter:7979

  # Application health endpoints through Caddy. Each target selects its
  # blackbox module with the "module" label.
  - job_name: probe_health
    scrape_interval: 60s
    metrics_path: /probe
    static_configs:
      - targets: ["http://caddy.atlas.local/"]
        labels: {module: http_caddy_ok, service: caddy}
      - targets: ["http://grafana.atlas.local/api/health"]
        labels: {module: http_grafana_health, service: grafana}
      - targets: ["http://komodo.atlas.local/version"]
        labels: {module: http_health_200, service: komodo}
      - targets: ["http://sonarr.atlas.local/ping"]
        labels: {module: http_servarr_ping, service: sonarr}
      - targets: ["http://radarr.atlas.local/ping"]
        labels: {module: http_servarr_ping, service: radarr}
      - targets: ["http://lidarr.atlas.local/ping"]
        labels: {module: http_servarr_ping, service: lidarr}
      - targets: ["http://prowlarr.atlas.local/ping"]
        labels: {module: http_servarr_ping, service: prowlarr}
      - targets: ["http://sabnzbd.atlas.local/api?mode=version&output=json"]
        labels: {module: http_sabnzbd_version, service: sabnzbd}
      - targets: ["http://plex.atlas.local/identity"]
        labels: {module: http_plex_identity, service: plex}
      - targets: ["http://192.168.2.200:32400/identity"]
        labels: {module: http_plex_identity, service: plex-direct}
      - targets: ["http://seerr.atlas.local/api/v1/status"]
        labels: {module: http_health_200, service: seerr}
      - targets: ["http://autobrr.atlas.local/api/healthz/readiness"]
        labels: {module: http_health_200, service: autobrr}
      - targets: ["http://houndarr.atlas.local/api/health"]
        labels: {module: http_health_200, service: houndarr}
      - targets: ["http://qui.atlas.local/health"]
        labels: {module: http_health_200, service: qui}
      - targets: ["http://spottarr.atlas.local/healthz"]
        labels: {module: http_health_200, service: spottarr}
    relabel_configs:
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Every Caddy route on the LAN hostname: DNS (UniFi wildcard), Caddy, and the app.
  - job_name: probe_routes
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_route]
    static_configs:
      - targets:
          - http://adguard.atlas.local
          - http://autobrr.atlas.local
          - http://backrest.atlas.local
          - http://bazarr.atlas.local
          - http://caddy.atlas.local
          - http://grafana.atlas.local
          - http://houndarr.atlas.local
          - http://komodo.atlas.local
          - http://lidarr.atlas.local
          - http://plex.atlas.local
          - http://prowlarr.atlas.local
          - http://qbittorrent.atlas.local
          - http://qui.atlas.local
          - http://radarr.atlas.local
          - http://sabnzbd.atlas.local
          - http://seerr.atlas.local
          - http://slskd.atlas.local
          - http://sonarr.atlas.local
          - http://speedtest.atlas.local
          - http://spottarr.atlas.local
          - http://ugos.atlas.local
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TCP services published on the NAS address.
  - job_name: probe_tcp
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["192.168.2.200:53"]
        labels:
          service: adguard-dns
      - targets: ["192.168.2.200:80"]
        labels:
          service: caddy
      - targets: ["192.168.2.200:9120"]
        labels:
          service: komodo
      - targets: ["192.168.2.200:32400"]
        labels:
          service: plex
      - targets: ["192.168.2.200:9330"]
        labels:
          service: roon
    relabel_configs: *probe_relabel

  # UniFi serves the *.atlas.local wildcard; it must resolve to the NAS.
  - job_name: probe_dns_atlas_local
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [dns_atlas_local]
    static_configs:
      - targets: ["192.168.2.1:53"]
        labels:
          service: unifi-dns
    relabel_configs: *probe_relabel

  # AdGuard must resolve external names.
  - job_name: probe_dns_external
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [dns_external]
    static_configs:
      - targets: ["192.168.2.200:53"]
        labels:
          service: adguard-dns
    relabel_configs: *probe_relabel

  # Public hostnames must answer with the Cloudflare Access login redirect.
  # This proves DNS and the Cloudflare edge, not the tunnel itself (see
  # cloudflared metrics in Phase 4b).
  - job_name: probe_cloudflare_access
    scrape_interval: 300s
    metrics_path: /probe
    params:
      module: [http_cloudflare_access]
    static_configs:
      - targets:
          - https://grafana.atlas.vandaele.io
          - https://seerr.atlas.vandaele.io
    relabel_configs: *probe_relabel

  # Outbound internet from the NAS (not through the VPN).
  - job_name: probe_internet
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://1.1.1.1/cdn-cgi/trace"]
        labels:
          service: internet
    relabel_configs: *probe_relabel
