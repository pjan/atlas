# Prometheus configuration for Atlas. Reloaded automatically (--config.auto-reload),
# together with the rule files in rules/ (see README "Alerts").
# Never put secrets in this file; use *_file settings with /run/secrets instead.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    instance_group: atlas

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: atlas

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox-exporter:9115", "blackbox-public:9115"]

  - job_name: smartctl
    scrape_interval: 60s
    static_configs:
      - targets: ["smartctl-exporter:9633"]
        labels:
          instance: atlas

  # cAdvisor without the Docker socket: series carry only the cgroup path.
  # Keep the metrics the dashboards use, derive container_id, and drop
  # non-container cgroups. Names come from atlas:container_names
  # (rules/containers.yml). Of the process metrics only threads are kept:
  # cAdvisor counts file descriptors and sockets in its own PID namespace.
  - job_name: cadvisor
    # cAdvisor timestamps its samples, so without this Prometheus keeps a
    # removed container's series for 5 minutes.
    track_timestamps_staleness: true
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: atlas
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_rss|spec_memory_limit_bytes|spec_cpu_quota|spec_cpu_period|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|oom_events_total|blkio_device_usage_total|start_time_seconds|last_seen|pressure_(cpu|memory|io)_waiting_seconds_total|threads|threads_max)'
        action: keep
      - source_labels: [id]
        regex: '/system\.slice/docker-([0-9a-f]{64})\.scope'
        target_label: container_id
        replacement: '$1'
      - source_labels: [container_id]
        regex: ''
        action: drop

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2020"]

  - job_name: cloudflared
    static_configs:
      - targets: ["cloudflared:2000"]

  - job_name: unpackerr
    static_configs:
      - targets: ["unpackerr:5656"]

  # authentik's server on monitoring_network (README "authentik").
  - job_name: authentik
    static_configs:
      - targets: ["authentik-server:9300"]

  # Application exporters (API keys from Komodo variables).
  - job_name: exportarr
    scrape_interval: 2m
    scrape_timeout: 90s
    static_configs:
      - targets: ["exportarr-radarr:9707"]
        labels: {app: radarr}
      - targets: ["exportarr-lidarr:9707"]
        labels: {app: lidarr}
      - targets: ["exportarr-prowlarr:9707"]
        labels: {app: prowlarr}
      - targets: ["exportarr-sabnzbd:9707"]
        labels: {app: sabnzbd}

  # Sonarr and Bazarr are slower to query.
  - job_name: exportarr_slow
    scrape_interval: 5m
    scrape_timeout: 2m
    static_configs:
      - targets: ["exportarr-sonarr:9707"]
        labels: {app: sonarr}
      - targets: ["exportarr-bazarr:9707"]
        labels: {app: bazarr}

  - job_name: json_exporter
    static_configs:
      - targets: ["json-exporter:7979"]

  # JSON APIs through json_exporter; each target selects its module.
  - job_name: json_apis
    scrape_interval: 60s
    metrics_path: /probe
    static_configs:
      - targets: ["http://downloaders-vpn:8000/v1/vpn/status"]
        labels: {module: gluetun_vpn_status, service: gluetun}
      - targets: ["http://downloaders-vpn:8000/v1/publicip/ip"]
        labels: {module: gluetun_public_ip, service: gluetun}
      - targets: ["http://downloaders-vpn:8000/v1/portforward"]
        labels: {module: gluetun_port_forward, service: gluetun}
      - targets: ["http://downloaders-vpn:8080/api/v2/app/preferences"]
        labels: {module: qbittorrent_preferences, service: qbittorrent}
      - targets: ["http://downloaders-vpn:8080/api/v2/transfer/info"]
        labels: {module: qbittorrent_transfer, service: qbittorrent}
      - targets: ["http://downloaders-vpn:5030/api/v0/server"]
        labels: {module: slskd_server, service: slskd}
      - targets: ["http://192.168.2.200:9120/read/ListStacks"]
        labels: {module: komodo_stacks, service: komodo}
      - targets: ["http://192.168.2.200:9120/read/ListAllStackServices"]
        labels: {module: komodo_containers, service: komodo}
      - targets: ["http://192.168.2.200:9120/read/ListServers"]
        labels: {module: komodo_servers, service: komodo}
      - targets: ["http://192.168.2.200:9120/read/ListActions"]
        labels: {module: komodo_actions, service: komodo}
      - targets: ["http://192.168.2.200:9120/read/ListProcedures"]
        labels: {module: komodo_procedures, service: komodo}
      - targets: ["http://192.168.2.200:9120/read/ListResourceSyncs"]
        labels: {module: komodo_syncs, service: komodo}
      - targets: ["http://192.168.2.200:9120/read/ListSchedules"]
        labels: {module: komodo_schedules, service: komodo}
      - targets: ["http://192.168.2.200:9120/read/ListAllContainers"]
        labels: {module: komodo_server_containers, service: komodo}
      - targets: ["http://192.168.2.200:9120/read/ListUpdates"]
        labels: {module: komodo_updates, service: komodo}
      - targets: ["http://192.168.2.200:9120/read/ListAlerts"]
        labels: {module: komodo_alerts, service: komodo}
    relabel_configs:
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: json-exporter:7979
    # Docker reports health and the exit code only inside the container
    # status text (container_status, from komodo_containers and
    # komodo_server_containers). Drop only that label: other modules keep
    # theirs, e.g. gluetun_vpn_status_info{status}.
    metric_relabel_configs:
      - source_labels: [__name__, container_status]
        regex: 'komodo_(container|server_container)_info;.*\((healthy|unhealthy|health: starting)\).*'
        target_label: health
        replacement: '$2'
      - source_labels: [__name__, container_status]
        regex: 'komodo_(container|server_container)_info;Exited \(([0-9]+)\).*'
        target_label: exit_code
        replacement: '$2'
      - regex: container_status
        action: labeldrop
      # A schedule error is multi-line text, "null" when there is none: keep only
      # the series of schedules with an error, without the text.
      - source_labels: [__name__, schedule_error]
        regex: 'komodo_schedule_error_info;null'
        action: drop
      - regex: schedule_error
        action: labeldrop

  # Application health endpoints, through Caddy unless noted. Each target
  # selects its blackbox module with the "module" label.
  - job_name: probe_health
    scrape_interval: 60s
    metrics_path: /probe
    static_configs:
      - targets: ["https://caddy.atlas.vandaele.io/"]
        labels: {module: http_caddy_ok, service: caddy}
      - targets: ["https://grafana.atlas.vandaele.io/api/health"]
        labels: {module: http_grafana_health, service: grafana}
      - targets: ["https://komodo.atlas.vandaele.io/version"]
        labels: {module: http_health_200, service: komodo}
      - targets: ["https://sonarr.atlas.vandaele.io/ping"]
        labels: {module: http_servarr_ping, service: sonarr}
      - targets: ["https://radarr.atlas.vandaele.io/ping"]
        labels: {module: http_servarr_ping, service: radarr}
      - targets: ["https://lidarr.atlas.vandaele.io/ping"]
        labels: {module: http_servarr_ping, service: lidarr}
      - targets: ["https://prowlarr.atlas.vandaele.io/ping"]
        labels: {module: http_servarr_ping, service: prowlarr}
      - targets: ["https://sabnzbd.atlas.vandaele.io/api?mode=version&output=json"]
        labels: {module: http_sabnzbd_version, service: sabnzbd}
      - targets: ["https://plex.atlas.vandaele.io/identity"]
        labels: {module: http_plex_identity, service: plex}
      - targets: ["http://192.168.2.200:32400/identity"]
        labels: {module: http_plex_identity, service: plex-direct}
      - targets: ["https://seerr.atlas.vandaele.io/api/v1/status"]
        labels: {module: http_health_200, service: seerr}
      - targets: ["https://autobrr.atlas.vandaele.io/api/healthz/readiness"]
        labels: {module: http_health_200, service: autobrr}
      - targets: ["https://houndarr.atlas.vandaele.io/api/health"]
        labels: {module: http_health_200, service: houndarr}
      - targets: ["https://qui.atlas.vandaele.io/health"]
        labels: {module: http_health_200, service: qui}
      - targets: ["https://spottarr.atlas.vandaele.io/healthz"]
        labels: {module: http_health_200, service: spottarr}
      # authentik directly on monitoring_network, and through the Cloudflare
      # Tunnel and Caddy: the public probe runs on blackbox-public, which
      # resolves through public DNS.
      - targets: ["http://authentik-server:9000/-/health/ready/"]
        labels: {module: http_health_200, service: authentik}
      - targets: ["https://auth.atlas.vandaele.io/-/health/live/"]
        labels: {module: http_health_200, service: authentik-public, __exporter: "blackbox-public:9115"}
    relabel_configs:
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__exporter]
        regex: (.+)
        target_label: __address__

  # Every Caddy route on its HTTPS hostname from the LAN: Atlas DNS (the UniFi
  # *.atlas.vandaele.io record), Caddy and its certificate, and the app.
  - job_name: probe_routes
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_route]
    static_configs:
      - targets:
          - https://adguard.atlas.vandaele.io
          - https://auth.atlas.vandaele.io
          - https://autobrr.atlas.vandaele.io
          - https://backrest.atlas.vandaele.io
          - https://bazarr.atlas.vandaele.io
          - https://caddy.atlas.vandaele.io
          - https://grafana.atlas.vandaele.io
          - https://houndarr.atlas.vandaele.io
          - https://komodo.atlas.vandaele.io
          - https://lidarr.atlas.vandaele.io
          - https://plex.atlas.vandaele.io
          - https://prowlarr.atlas.vandaele.io
          - https://qbittorrent.atlas.vandaele.io
          - https://qui.atlas.vandaele.io
          - https://radarr.atlas.vandaele.io
          - https://sabnzbd.atlas.vandaele.io
          - https://seerr.atlas.vandaele.io
          - https://slskd.atlas.vandaele.io
          - https://sonarr.atlas.vandaele.io
          - https://speedtest.atlas.vandaele.io
          - https://spottarr.atlas.vandaele.io
          - https://ugos.atlas.vandaele.io
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TCP services published on the NAS address.
  - job_name: probe_tcp
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["192.168.2.200:53"]
        labels:
          service: adguard-dns
      - targets: ["192.168.2.200:80"]
        labels:
          service: caddy
      - targets: ["192.168.2.200:9120"]
        labels:
          service: komodo
      - targets: ["192.168.2.200:32400"]
        labels:
          service: plex
      - targets: ["192.168.2.200:9330"]
        labels:
          service: roon
    relabel_configs: *probe_relabel

  # UniFi serves the *.atlas.local wildcard (redirects to HTTPS); it must
  # resolve to the NAS.
  - job_name: probe_dns_atlas_local
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [dns_atlas_local]
    static_configs:
      - targets: ["192.168.2.1:53"]
        labels:
          service: unifi-dns
    relabel_configs: *probe_relabel

  # Atlas DNS for *.atlas.vandaele.io: UniFi (LAN, the NAS, containers) and
  # AdGuard (Tailscale) must both send it to the NAS, not to Cloudflare.
  - job_name: probe_dns_split
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [dns_split]
    static_configs:
      - targets: ["192.168.2.1:53"]
        labels:
          service: unifi-dns
      - targets: ["192.168.2.200:53"]
        labels:
          service: adguard-dns
    relabel_configs: *probe_relabel

  # AdGuard must resolve external names.
  - job_name: probe_dns_external
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [dns_external]
    static_configs:
      - targets: ["192.168.2.200:53"]
        labels:
          service: adguard-dns
    relabel_configs: *probe_relabel

  # Every public route from the internet: Cloudflare DNS, the Cloudflare
  # Tunnel, Caddy's :8080 listener, and the app (401 and 403 count as up).
  # Probed from blackbox-public, which resolves through public DNS. rclone has
  # no public route.
  - job_name: probe_routes_public
    scrape_interval: 120s
    metrics_path: /probe
    static_configs:
      - targets: ["https://adguard.atlas.vandaele.io"]
        labels: {module: http_route, service: adguard-public}
      - targets: ["https://auth.atlas.vandaele.io"]
        labels: {module: http_route, service: auth-public}
      - targets: ["https://autobrr.atlas.vandaele.io"]
        labels: {module: http_route, service: autobrr-public}
      - targets: ["https://bazarr.atlas.vandaele.io"]
        labels: {module: http_route, service: bazarr-public}
      - targets: ["https://caddy.atlas.vandaele.io"]
        labels: {module: http_route, service: caddy-public}
      - targets: ["https://grafana.atlas.vandaele.io"]
        labels: {module: http_route, service: grafana-public}
      - targets: ["https://houndarr.atlas.vandaele.io"]
        labels: {module: http_route, service: houndarr-public}
      - targets: ["https://komodo.atlas.vandaele.io"]
        labels: {module: http_route, service: komodo-public}
      - targets: ["https://lidarr.atlas.vandaele.io"]
        labels: {module: http_route, service: lidarr-public}
      - targets: ["https://plex.atlas.vandaele.io"]
        labels: {module: http_route, service: plex-public}
      - targets: ["https://prowlarr.atlas.vandaele.io"]
        labels: {module: http_route, service: prowlarr-public}
      - targets: ["https://qbittorrent.atlas.vandaele.io"]
        labels: {module: http_route, service: qbittorrent-public}
      - targets: ["https://qui.atlas.vandaele.io"]
        labels: {module: http_route, service: qui-public}
      - targets: ["https://radarr.atlas.vandaele.io"]
        labels: {module: http_route, service: radarr-public}
      - targets: ["https://sabnzbd.atlas.vandaele.io"]
        labels: {module: http_route, service: sabnzbd-public}
      - targets: ["https://seerr.atlas.vandaele.io"]
        labels: {module: http_route, service: seerr-public}
      - targets: ["https://slskd.atlas.vandaele.io"]
        labels: {module: http_route, service: slskd-public}
      - targets: ["https://sonarr.atlas.vandaele.io"]
        labels: {module: http_route, service: sonarr-public}
      - targets: ["https://speedtest.atlas.vandaele.io"]
        labels: {module: http_route, service: speedtest-public}
      - targets: ["https://spottarr.atlas.vandaele.io"]
        labels: {module: http_route, service: spottarr-public}
      - targets: ["https://ugos.atlas.vandaele.io"]
        labels: {module: http_route, service: ugos-public}
    relabel_configs:
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-public:9115

  # Caddy's HTTPS listener and the *.atlas.vandaele.io certificate it serves,
  # without DNS (CertificateExpiringSoon).
  - job_name: probe_tls_caddy
    scrape_interval: 300s
    metrics_path: /probe
    params:
      module: [tls_caddy]
    static_configs:
      - targets: ["192.168.2.200:443"]
        labels:
          service: caddy
    relabel_configs: *probe_relabel

  # Outbound internet from the NAS (not through the VPN).
  - job_name: probe_internet
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://1.1.1.1/cdn-cgi/trace"]
        labels:
          service: internet
    relabel_configs: *probe_relabel
