# blackbox_exporter modules for Atlas. Reloaded automatically
# (--config.enable-auto-reload). Never put secrets in this file; read secret
# headers from files under /run/secrets instead.

modules:
  # Caddy route to an application. 401/403 mean the application answered and
  # requires a login, which is healthy for an unauthenticated probe.
  http_route:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200, 204, 301, 302, 303, 307, 308, 401, 403]

  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4

  # Application health endpoints: HTTP 200 and an expected body.
  http_health_200:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200]

  # Sonarr, Radarr, Lidarr, Prowlarr: anonymous /ping returns 500 and
  # "Error" when the application cannot reach its database.
  http_servarr_ping:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"status"\s*:\s*"OK"'

  http_plex_identity:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - 'machineIdentifier="[^"]+"'

  http_grafana_health:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"database"\s*:\s*"ok"'

  http_sabnzbd_version:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"version"\s*:\s*"[0-9]'

  http_caddy_ok:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '^ok$'

  # Caddy's HTTPS listener: the TLS handshake must succeed with a certificate
  # valid for *.atlas.vandaele.io. Exports probe_ssl_earliest_cert_expiry.
  tls_caddy:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      tls: true
      tls_config:
        server_name: caddy.atlas.vandaele.io

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4

  dns_atlas_local:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      transport_protocol: udp
      query_name: sonarr.atlas.local
      query_type: A
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp:
          - '.*\t192\.168\.2\.200$'

  dns_split:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      transport_protocol: udp
      query_name: sonarr.atlas.vandaele.io
      query_type: A
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp:
          - '.*\t192\.168\.2\.200$'

  dns_external:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      transport_protocol: udp
      query_name: github.com
      query_type: A
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp:
          - '.*\tA\t.*'
