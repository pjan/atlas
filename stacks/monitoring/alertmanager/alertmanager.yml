# Alertmanager configuration for Atlas (see README "Alerts"). The monitoring
# post_deploy reloads it with SIGHUP; an invalid file keeps the previous
# configuration (alertmanager_config_last_reload_successful = 0).
# Never put secrets in this file: webhook URLs come from Compose secrets
# under /run/secrets through url_file.

route:
  receiver: discord
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Heartbeat to Healthchecks.io, repeated every 5 minutes.
    - matchers: ['alertname="Watchdog"']
      receiver: healthchecks-watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m
    - matchers: ['severity="critical"']
      receiver: discord
      repeat_interval: 4h

# A root cause suppresses the alerts it causes, in Discord only: inhibited
# alerts still turn their tiles red or amber on Atlas Critical Health.
inhibit_rules:
  # Every probe except plex-direct and authentik goes through Caddy.
  - source_matchers: ['alertname="CaddyDown"']
    target_matchers: ['alertname="ProbeFailed"', 'service!~"plex-direct|authentik"']
  # Every probe of an app behind authentik forward auth passes through its
  # embedded outpost, health paths included.
  - source_matchers: ['alertname="ProbeFailed"', 'service="authentik"']
    target_matchers: ['alertname="ProbeFailed"', 'service=~"(adguard|autobrr|bazarr|dispatcharr|houndarr|jupyter|lidarr|prowlarr|qbittorrent|qui|radarr|rclone|sabnzbd|slskd|sonarr|speedtest|spottarr|ugos|youtarr)(-public|-gate|-gate-public)?"']
  # The public probes (<app>-public) go through the Cloudflare Tunnel.
  - source_matchers: ['alertname="TunnelDown"']
    target_matchers: ['alertname="ProbeFailed"', 'service=~".+-public"']
  # Applications in Gluetun's network namespace (network_mode container:gluetun).
  - source_matchers: ['alertname="VpnDown"']
    target_matchers:
      - alertname="ProbeFailed"
      - service=~"(autobrr|bazarr|flaresolverr|lidarr|prowlarr|qbittorrent|radarr|sabnzbd|slskd|sonarr|spottarr)(-public)?"
  - source_matchers: ['alertname="VpnDown"']
    target_matchers: ['alertname="PortForwardMismatch"']
  - source_matchers: ['alertname="VolumeSpaceCritical"']
    target_matchers: ['alertname="VolumeSpaceLow"']
    equal: [mountpoint]
  # A crash-looping container makes its stack restarting or unhealthy in Komodo.
  - source_matchers: ['alertname="ContainerCrashLooping"']
    target_matchers: ['alertname="StackUnhealthy"']
    equal: [stack]

receivers:
  # Rich embeds rendered by atlas.tmpl, at most 4 per message.
  - name: discord
    webhook_configs:
      - url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        timeout: 10s
        payload:
          allowed_mentions:
            parse: []
          embeds: '{{ template "atlas.embeds" . }}'

  # A resolved Watchdog must not count as a heartbeat.
  - name: healthchecks-watchdog
    webhook_configs:
      - url_file: /run/secrets/healthchecks_watchdog_url
        send_resolved: false
        timeout: 10s

templates:
  - /etc/alertmanager/*.tmpl
