services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls272
    container_name: sabnzbd
    restart: unless-stopped
    network_mode: "container:gluetun"
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
      - SABNZBD_PORT=${SABNZBD_PORT}
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?CONFIG_DIR is required}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${USENET_DIR:?USENET_DIR is required}
        target: /data/downloads/usenet
        bind:
          create_host_path: false
      - type: bind
        source: ./custom-cont-init.d
        target: /custom-cont-init.d
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 1m
    mem_limit: 768m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SABNZBD_PORT}/ >/dev/null || wget -qO- http://127.0.0.1:${SABNZBD_PORT}/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
