services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:1.15.0
    container_name: speedtest-tracker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - APP_KEY=${SPEEDTEST_TRACKER_APP_KEY:?missing Speedtest Tracker app key}
      - APP_URL=${APP_URL}
      - ASSET_URL=${APP_URL}
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=${SPEEDTEST_TRACKER_SCHEDULE}
      - SPEEDTEST_SERVERS=${SPEEDTEST_TRACKER_SERVERS:-}
      - DISPLAY_TIMEZONE=${TZ}
      - PRUNE_RESULTS_OLDER_THAN=${SPEEDTEST_TRACKER_PRUNE_RESULTS_OLDER_THAN}
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?CONFIG_DIR is required}
        target: /config
        bind:
          create_host_path: false
    expose:
      - "80"
    networks:
      - proxy_network
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  proxy_network:
    name: proxy_network
    external: true
