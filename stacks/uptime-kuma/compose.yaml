services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.3
    container_name: uptime-kuma
    restart: unless-stopped
    init: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - UPTIME_KUMA_HOST=0.0.0.0
      - UPTIME_KUMA_PORT=3001
      - DATA_DIR=/app/data
    volumes:
      - ${CONFIG_DIR}:/app/data
    networks:
      - proxy_network
    mem_limit: 1g
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

#################################
# NETWORK
#################################
networks:
  proxy_network:
    name: proxy_network
    external: true
