services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    container_name: cloudflared
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - tunnel
      - --metrics
      - 127.0.0.1:2000
      - run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?missing Cloudflare Tunnel token}
    networks:
      - proxy_network
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy_network:
    name: proxy_network
    external: true
