services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.1
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WIREGUARD_PRIVATE_KEY:?missing ProtonVPN WireGuard private key}
      - SERVER_COUNTRIES=${PROTONVPN_SERVER_COUNTRIES:-Singapore}
      - PORT_FORWARD_ONLY=${PROTONVPN_PORT_FORWARD_ONLY:-on}
      - VPN_PORT_FORWARDING=${PROTONVPN_VPN_PORT_FORWARDING:-on}
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_CONTROL_API_KEY:?missing Gluetun control API key}"}
      - FIREWALL_INPUT_PORTS=8000,8080,8085
      - UPDATER_PERIOD=24h
    volumes:
      - ${CONFIG_DIR}:/gluetun
    expose:
      - "8000"
      - "8080"
      - "8085"
    networks:
      media_network:
        aliases:
          - downloaders-vpn
      proxy_network:
        aliases:
          - downloaders-vpn
    mem_limit: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "/gluetun-entrypoint healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

#################################
# NETWORK
#################################
networks:
  media_network:
    name: media_network
    external: true
  proxy_network:
    name: proxy_network
    external: true
