services:
  soularr:
    image: mrusse08/soularr:v1.2.2
    container_name: soularr
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - SCRIPT_INTERVAL=${SCRIPT_INTERVAL}
      - LIDARR_API_KEY=${LIDARR_API_KEY:?missing Lidarr API key}
      - SLSKD_API_KEY=${SLSKD_API_KEY:?missing slskd API key}
      - WEBUI_ENABLED=false
    volumes:
      - type: bind
        source: ${SOULARR_CONFIG_DIR:?SOULARR_CONFIG_DIR is required}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./config/config.ini
        target: /data/config.ini
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SLSKD_COMPLETE_DIR:?SLSKD_COMPLETE_DIR is required}
        target: /downloads
        bind:
          create_host_path: false
    networks:
      - media_network
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          log=/data/soularr.log; [ -e $$log ] || exit 1;
          age=$$(($$(date +%s) - $$(stat -c %Y $$log)));
          pid=$$(pgrep -f '[s]oularr[.]py' | head -n 1);
          if [ -n "$$pid" ] && [ $$age -le $$(ps -o etimes= -p $$pid) ] 2>/dev/null; then running=1; limit=7200;
          else running=0; limit=$$(($${SCRIPT_INTERVAL:-300} + 300)); fi;
          [ $$age -lt $$limit ] || exit 1;
          awk -v running=$$running 'BEGIN{prev=1} /Logging to file: /{prev=(n ? ok && !bad : 1); n=0; ok=0; bad=0}
          {n++}
          /No releases wanted|Soularr finished[.] Exiting|releases failed to find a match/{ok=1}
          /Max retries exceeded|Failed to establish a new connection|requests[.]exceptions[.](ConnectionError|ConnectTimeout|ReadTimeout)/{bad=1}
          END{exit !((running ? prev : ok) && !bad)}' $$log
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  media_network:
    name: media_network
    external: true
