services:
  soularr:
    image: mrusse08/soularr:v1.2.2
    container_name: soularr
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - SCRIPT_INTERVAL=${SCRIPT_INTERVAL}
      - LIDARR_API_KEY=${LIDARR_API_KEY:?missing Lidarr API key}
      - SLSKD_API_KEY=${SLSKD_API_KEY:?missing slskd API key}
      - WEBUI_ENABLED=false
    volumes:
      - ${SOULARR_CONFIG_DIR}:/data
      - ./config/config.ini:/data/config.ini:ro
      - ${SLSKD_COMPLETE_DIR}:/downloads
    networks:
      - media_network
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  media_network:
    name: media_network
    external: true
