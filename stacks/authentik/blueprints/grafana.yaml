# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Grafana logs in through authentik with OpenID Connect (README "authentik").
# Open to admins and family; Grafana maps admins to its Admin role and everyone
# else to Viewer (GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH in
# stacks/monitoring/compose.yaml). The client secret is the Komodo variable
# GRAFANA_OIDC_CLIENT_SECRET, which the monitoring stack receives too.
version: 1
metadata:
  name: Atlas - Grafana
  labels:
    # Applied by the authentik stack's post_deploy, in order, never by the
    # worker's queue (README "Blueprints").
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Grafana
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: grafana
      client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
      # Empty by default since 2026.x, which rejects every login.
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.atlas.vandaele.io/login/generic_oauth
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # The profile scope carries the groups claim.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: application
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      group: System
      provider: !KeyOf provider
      meta_launch_url: https://grafana.atlas.vandaele.io
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, admins]]
      order: 0

  # family as Viewer (GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH).
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, family]]
      order: 1
