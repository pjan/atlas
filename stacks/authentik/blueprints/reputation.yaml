# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Brute-force protection (README "authentik"): an IP with a reputation of -5 or
# less (five failed logins, decaying after a day) cannot start the login flow.
# Usernames are not checked, so nobody can lock out a known user. A reputation
# policy passes at or below its threshold, so the binding is negated.
version: 1
metadata:
  name: Atlas - Login reputation
  labels:
    # Applied by the authentik stack's post_deploy, in order, never by the
    # worker's queue (README "Blueprints").
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_policies_reputation.reputationpolicy
    identifiers:
      name: atlas-login-reputation-ip
    attrs:
      check_ip: true
      check_username: false
      threshold: -5

  # Both by !Find, not !KeyOf, and the target is the flow's policy binding
  # model (its pbm_uuid, not its flow_uuid): otherwise the existing binding is
  # not found when the blueprint is applied again, and creating it twice fails.
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_policies.policybindingmodel, [flow__slug, default-authentication-flow]]
      policy: !Find [authentik_policies_reputation.reputationpolicy, [name, atlas-login-reputation-ip]]
      order: 0
    attrs:
      negate: true
