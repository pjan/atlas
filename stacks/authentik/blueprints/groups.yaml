# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Atlas groups (README "authentik"). Users are created in the authentik UI,
# never here: they carry passwords.
version: 1
metadata:
  name: Atlas - Groups
  labels:
    # Applied by the authentik stack's post_deploy, in order, never by the
    # worker's queue (README "Blueprints").
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # pjan. Also authentik superusers, so akadmin can be disabled.
  - model: authentik_core.group
    identifiers:
      name: admins
    attrs:
      is_superuser: true

  # pjan's family.
  - model: authentik_core.group
    identifiers:
      name: family
    attrs:
      is_superuser: false
