# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# The embedded outpost, inside authentik-server, answers Caddy's forward_auth
# checks (README "authentik"). This file alone lists its providers: every
# forward-auth-*.yaml provider must be listed here.
version: 1
metadata:
  name: Atlas - Embedded outpost
  labels:
    # Applied by the authentik stack's post_deploy, in order, never by the
    # worker's queue (README "Blueprints").
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, adguard]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, autobrr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, bazarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, houndarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, lidarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, prowlarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, qbittorrent]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, qui]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, radarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, rclone]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, sabnzbd]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, slskd]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, sonarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, speedtest]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, spottarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, ugos]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, youtarr]]
      # Login, callback, and logout URLs the browser follows.
      config:
        authentik_host: https://auth.atlas.vandaele.io
        authentik_host_insecure: false
        authentik_host_browser: ""
        log_level: info
        refresh_interval: minutes=5
