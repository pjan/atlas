services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:v1.87.0
    container_name: autobrr
    restart: unless-stopped
    init: true
    user: "${PUID}:${PGID}"
    read_only: true
    tmpfs:
      - /tmp
    network_mode: "container:gluetun"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - AUTOBRR__HOST=0.0.0.0
      - AUTOBRR__PORT=7474
      - AUTOBRR__CHECK_FOR_UPDATES=false
      # Login through authentik with OpenID Connect, behind forward auth
      # (README "autobrr"). Hiding the password form is cosmetic in autobrr;
      # forward auth is what closes it.
      - AUTOBRR__OIDC_ENABLED=true
      - AUTOBRR__OIDC_ISSUER=https://auth.atlas.vandaele.io/application/o/autobrr/
      - AUTOBRR__OIDC_CLIENT_ID=autobrr
      - AUTOBRR__OIDC_CLIENT_SECRET=${AUTOBRR_OIDC_CLIENT_SECRET:?AUTOBRR_OIDC_CLIENT_SECRET is required}
      - AUTOBRR__OIDC_REDIRECT_URL=https://autobrr.atlas.vandaele.io/api/auth/oidc/callback
      - AUTOBRR__OIDC_DISABLE_BUILT_IN_LOGIN=true
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?CONFIG_DIR is required}
        target: /config
        bind:
          create_host_path: false
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:7474/api/healthz/readiness >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
