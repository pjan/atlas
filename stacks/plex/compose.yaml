services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.4.10903-e5521bd8c-ls324
    container_name: plex
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
      - ADVERTISE_IP=http://${NAS_LAN_IP:?NAS_LAN_IP is required}:32400/,http://plex.atlas.local/
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?CONFIG_DIR is required}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_DIR:?MEDIA_DIR is required}
        target: /data/media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TRANSCODE_DIR:?TRANSCODE_DIR is required}
        target: /transcode
        bind:
          create_host_path: false
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      - "${NAS_LAN_IP:?NAS_LAN_IP is required}:32400:32400/tcp"
    networks:
      - media_network
      - proxy_network
    mem_limit: 2g
    pids_limit: 512
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:32400/web/index.html >/dev/null || wget -q --spider http://127.0.0.1:32400/web/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

#################################
# NETWORK
#################################
networks:
  media_network:
    name: media_network
    external: true
  proxy_network:
    name: proxy_network
    external: true
