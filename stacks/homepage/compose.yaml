services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.3.0
    container_name: homepage
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - LOG_TARGETS=${LOG_TARGETS}
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
      - HOMEPAGE_VAR_ADGUARD_USERNAME=${HOMEPAGE_VAR_ADGUARD_USERNAME}
      - HOMEPAGE_VAR_ADGUARD_PASSWORD=${HOMEPAGE_VAR_ADGUARD_PASSWORD}
      - HOMEPAGE_VAR_BAZARR_API_KEY=${HOMEPAGE_VAR_BAZARR_API_KEY}
      - HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID=${HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}
      - HOMEPAGE_VAR_CLOUDFLARE_API_TOKEN=${HOMEPAGE_VAR_CLOUDFLARE_API_TOKEN}
      - HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID=${HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID}
      - HOMEPAGE_VAR_GLUETUN_API_KEY=${HOMEPAGE_VAR_GLUETUN_API_KEY}
      - HOMEPAGE_VAR_KOMODO_API_KEY=${HOMEPAGE_VAR_KOMODO_API_KEY}
      - HOMEPAGE_VAR_KOMODO_API_SECRET=${HOMEPAGE_VAR_KOMODO_API_SECRET}
      - HOMEPAGE_VAR_LIDARR_API_KEY=${HOMEPAGE_VAR_LIDARR_API_KEY}
      - HOMEPAGE_VAR_PLEX_TOKEN=${HOMEPAGE_VAR_PLEX_TOKEN}
      - HOMEPAGE_VAR_PROWLARR_API_KEY=${HOMEPAGE_VAR_PROWLARR_API_KEY}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${HOMEPAGE_VAR_QBITTORRENT_PASSWORD}
      - HOMEPAGE_VAR_QBITTORRENT_USERNAME=${HOMEPAGE_VAR_QBITTORRENT_USERNAME}
      - HOMEPAGE_VAR_RADARR_API_KEY=${HOMEPAGE_VAR_RADARR_API_KEY}
      - HOMEPAGE_VAR_SABNZBD_API_KEY=${HOMEPAGE_VAR_SABNZBD_API_KEY}
      - HOMEPAGE_VAR_SEERR_API_KEY=${HOMEPAGE_VAR_SEERR_API_KEY}
      - HOMEPAGE_VAR_SLSKD_API_KEY=${HOMEPAGE_VAR_SLSKD_API_KEY}
      - HOMEPAGE_VAR_SONARR_API_KEY=${HOMEPAGE_VAR_SONARR_API_KEY}
      - HOMEPAGE_VAR_SPEEDTEST_TRACKER_API_KEY=${HOMEPAGE_VAR_SPEEDTEST_TRACKER_API_KEY}
      - HOMEPAGE_VAR_UNIFI_API_KEY=${HOMEPAGE_VAR_UNIFI_API_KEY}
      - HOMEPAGE_VAR_UNIFI_URL=${HOMEPAGE_VAR_UNIFI_URL}
      - HOMEPAGE_VAR_UPTIME_KUMA_SLUG=${HOMEPAGE_VAR_UPTIME_KUMA_SLUG}
    volumes:
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "3000"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - proxy_network
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy_network:
    name: proxy_network
    external: true
