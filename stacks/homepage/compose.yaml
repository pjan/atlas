services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.3.0
    container_name: homepage
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - LOG_TARGETS=${LOG_TARGETS}
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
      - HOMEPAGE_VAR_ADGUARD_USERNAME=${HOMEPAGE_ADGUARD_USERNAME:?HOMEPAGE_ADGUARD_USERNAME is required}
      - HOMEPAGE_VAR_ADGUARD_PASSWORD=${HOMEPAGE_ADGUARD_PASSWORD:?HOMEPAGE_ADGUARD_PASSWORD is required}
      - HOMEPAGE_VAR_BAZARR_API_KEY=${BAZARR_API_KEY:?BAZARR_API_KEY is required}
      - HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}
      - HOMEPAGE_VAR_CLOUDFLARE_API_TOKEN=${HOMEPAGE_CLOUDFLARE_API_TOKEN:?HOMEPAGE_CLOUDFLARE_API_TOKEN is required}
      - HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID=${CLOUDFLARE_TUNNEL_ID:?CLOUDFLARE_TUNNEL_ID is required}
      - HOMEPAGE_VAR_GLUETUN_CONTROL_API_KEY=${GLUETUN_CONTROL_API_KEY:?GLUETUN_CONTROL_API_KEY is required}
      - HOMEPAGE_VAR_KOMODO_API_KEY=${HOMEPAGE_KOMODO_API_KEY:?HOMEPAGE_KOMODO_API_KEY is required}
      - HOMEPAGE_VAR_KOMODO_API_SECRET=${HOMEPAGE_KOMODO_API_SECRET:?HOMEPAGE_KOMODO_API_SECRET is required}
      - HOMEPAGE_VAR_LIDARR_API_KEY=${LIDARR_API_KEY:?LIDARR_API_KEY is required}
      - HOMEPAGE_VAR_PLEX_SERVER_TOKEN=${PLEX_SERVER_TOKEN:?PLEX_SERVER_TOKEN is required}
      - HOMEPAGE_VAR_PROWLARR_API_KEY=${PROWLARR_API_KEY:?PROWLARR_API_KEY is required}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:?QBITTORRENT_PASSWORD is required}
      - HOMEPAGE_VAR_QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME:?QBITTORRENT_USERNAME is required}
      - HOMEPAGE_VAR_RADARR_API_KEY=${RADARR_API_KEY:?RADARR_API_KEY is required}
      - HOMEPAGE_VAR_SABNZBD_API_KEY=${SABNZBD_API_KEY:?SABNZBD_API_KEY is required}
      - HOMEPAGE_VAR_SEERR_API_KEY=${SEERR_API_KEY:?SEERR_API_KEY is required}
      - HOMEPAGE_VAR_SLSKD_API_KEY=${SLSKD_API_KEY:?SLSKD_API_KEY is required}
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY:?SONARR_API_KEY is required}
      - HOMEPAGE_VAR_SPEEDTEST_TRACKER_API_KEY=${HOMEPAGE_SPEEDTEST_TRACKER_API_KEY:?HOMEPAGE_SPEEDTEST_TRACKER_API_KEY is required}
      - HOMEPAGE_VAR_UNIFI_API_KEY=${HOMEPAGE_UNIFI_API_KEY:?HOMEPAGE_UNIFI_API_KEY is required}
      - HOMEPAGE_VAR_UNIFI_URL=${UNIFI_URL:?UNIFI_URL is required}
      - HOMEPAGE_VAR_UPTIME_KUMA_SLUG=${UPTIME_KUMA_SLUG:?UPTIME_KUMA_SLUG is required}
    volumes:
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "3000"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - proxy_network
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy_network:
    name: proxy_network
    external: true
