    - Autobrr:
        icon: autobrr.png
        href: http://autobrr.atlas.local
        description: Download automation
    - Houndarr:
        icon: mdi-dog-side
        href: http://houndarr.atlas.local
        description: Controlled missing-media searches
    - qBittorrent:
        icon: qbittorrent.png
        href: http://qbittorrent.atlas.vandaele.io
        description: Torrent downloads
        widget:
          type: qbittorrent
          url: http://downloaders-vpn:8080
