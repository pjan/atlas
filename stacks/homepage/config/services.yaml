    - SABnzbd:
        icon: sabnzbd.png
        href: http://sabnzbd.atlas.vandaele.io
        description: Usenet downloads
        widget:
          type: sabnzbd
          url: http://downloaders-vpn:8085
          key: "{{HOMEPAGE_VAR_SABNZBD_API_KEY}}"
          fields: ["rate", "queue", "timeleft"]
    - slskd:
        icon: slskd.png
        href: http://slskd.atlas.vandaele.io
        description: Soulseek downloads
        widget:
          type: slskd
          url: http://downloaders-vpn:5030
          key: "{{HOMEPAGE_VAR_SLSKD_API_KEY}}"
          fields: ["slskStatus", "downloads", "uploads", "sharedFiles"]
    - Plex:
        icon: plex.png
        href: http://plex.atlas.vandaele.io
        description: Media streaming
        widget:
          type: plex
          url: http://plex:32400
          key: "{{HOMEPAGE_VAR_PLEX_SERVER_TOKEN}}"

- Operations:
    - Komodo:
        icon: komodo.png
        href: http://komodo.atlas.vandaele.io
        description: Stack orchestration
        widget:
          type: komodo
          url: http://host.docker.internal:9120
          key: "{{HOMEPAGE_VAR_KOMODO_API_KEY}}"
          secret: "{{HOMEPAGE_VAR_KOMODO_API_SECRET}}"
          showSummary: true
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: http://uptime.atlas.vandaele.io
        description: Availability monitoring
        siteMonitor: http://uptime-kuma:3001/
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: "{{HOMEPAGE_VAR_UPTIME_KUMA_SLUG}}"
          fields: ["up", "down", "uptime", "incident"]
    - Speedtest Tracker:
        icon: speedtest-tracker.png
        href: http://speedtest.atlas.vandaele.io
        description: Internet performance history
        widget:
          type: speedtest
          url: http://speedtest-tracker
          version: 2
          key: "{{HOMEPAGE_VAR_SPEEDTEST_TRACKER_API_KEY}}"
          bitratePrecision: 2
          fields: ["download", "upload", "ping"]

- Network & DNS:
    - Gluetun:
        icon: gluetun.png
        description: Proton VPN tunnel
        widget:
          type: gluetun
          url: http://downloaders-vpn:8000
          key: "{{HOMEPAGE_VAR_GLUETUN_CONTROL_API_KEY}}"
          version: 2
          fields: ["public_ip", "country", "region", "port_forwarded"]
    - AdGuard Home:
        icon: adguard-home.png
        href: http://adguard.atlas.vandaele.io
        description: DNS and ad blocking
        widget:
          type: adguard
          url: http://adguard:3000
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
    - Cloudflare Tunnel:
        icon: cloudflare-zero-trust.png
        description: Remote access tunnel
        widget:
          type: cloudflared
          accountid: "{{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}}"
          tunnelid: "{{HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID}}"
          key: "{{HOMEPAGE_VAR_CLOUDFLARE_API_TOKEN}}"
          fields: ["status", "origin_ip"]
    - UniFi:
        icon: unifi.png
        href: "{{HOMEPAGE_VAR_UNIFI_URL}}"
        description: Network controller
        widget:
          type: unifi
          url: "{{HOMEPAGE_VAR_UNIFI_URL}}"
          key: "{{HOMEPAGE_VAR_UNIFI_API_KEY}}"
          fields: ["uptime", "wan", "lan_devices", "wlan_devices"]

- Storage & NAS:
    - Rclone:
        icon: rclone.png
        href: http://rclone.atlas.vandaele.io
        description: Remote storage UI
    - UGOS:
        icon: mdi-nas
        href: http://ugos.atlas.vandaele.io
        description: NAS administration
        siteMonitor: http://host.docker.internal:9999/
