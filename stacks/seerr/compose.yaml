services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    restart: unless-stopped
    init: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - PORT=5055
    volumes:
      - ${CONFIG_DIR}:/app/config
    expose:
      - "5055"
    networks:
      - media_network
      - proxy_network
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

#################################
# NETWORK
#################################
networks:
  media_network:
    name: media_network
    external: true
  proxy_network:
    name: proxy_network
    external: true
