### VARIABLES ###

[[variable]]
name = "APPDATA_DIR"
value = "/volume2/appdata"

[[variable]]
name = "DATA_DIR"
value = "/volume1/data"

[[variable]]
name = "PUID"
value = "999"

[[variable]]
name = "PGID"
value = "10"

[[variable]]
name = "TZ"
value = "Etc/UTC"

### STACKS ###

[[stack]]
name = "sonarr"
description = "sonarr"
deploy = true
tags = ["media"]

[stack.config]
server = "atlas"
repo = "pjan/atlas"
run_directory = "stacks/sonarr"
file_paths = ["compose.yaml"]
auto_pull = true
poll_for_updates = true
links = ["http://atlas.local:8989"]
pre_deploy.path = "."
pre_deploy.command = "docker network inspect media_network >/dev/null 2>&1 || docker network create media_network"
pre_deploy.shell_mode = true
environment = """
PORT = 8989
PUID = [[PUID]]
PGID = [[PGID]]
TZ = [[TZ]]
UMASK = 002
CONFIG_DIR = [[APPDATA_DIR]]/sonarr
DATA_DIR = [[DATA_DIR]]
"""
