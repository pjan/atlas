sh ../../scripts/ensure-docker-network.sh media_network
sh ../../scripts/atlas-hostfs.sh ensure-dir \
  "[[APPDATA_DIR]]/kometa" [[PUID]] [[PGID]] 0750
sh ../../scripts/atlas-hostfs.sh ensure-dir \
  "[[APPDATA_DIR]]/kometa/collections" [[PUID]] [[PGID]] 0750
