[[stack]]
name = "qbittorrent"
description = "qBittorrent routed through Gluetun"
deploy = true
after = ["gluetun"]
tags = ["media", "download"]

[stack.config]
server = "atlas"
repo = "pjan/atlas"
branch = "main"
run_directory = "stacks/qbittorrent"
file_paths = ["compose.yaml"]
auto_pull = true
poll_for_updates = true
links = ["http://qbittorrent.atlas.local"]
pre_deploy.path = "."
pre_deploy.command = """
test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' gluetun 2>/dev/null)" = "healthy"
install -d -o [[PUID]] -g [[PGID]] -m 2775 \
  "[[APPDATA_DIR]]/qbittorrent" \
  "[[DATA_DIR]]/downloads/torrents/incomplete" \
  "[[DATA_DIR]]/downloads/torrents/completed" \
  "[[DATA_DIR]]/downloads/torrents/completed/tv" \
  "[[DATA_DIR]]/downloads/torrents/completed/movies" \
  "[[DATA_DIR]]/downloads/torrents/completed/music"
"""
pre_deploy.shell_mode = true
environment = """
PUID = [[PUID]]
PGID = [[PGID]]
TZ = [[TZ]]
UMASK = 002
CONFIG_DIR = [[APPDATA_DIR]]/qbittorrent
TORRENTS_DIR = [[DATA_DIR]]/downloads/torrents
"""

[[stack]]
name = "rclone"
description = "Rclone web UI and remote-control stack"
deploy = true
tags = ["infra", "storage"]

[stack.config]
server = "atlas"
repo = "pjan/atlas"
branch = "main"
run_directory = "stacks/rclone"
file_paths = ["compose.yaml"]
auto_pull = true
poll_for_updates = true
links = ["http://rclone.atlas.local/"]
pre_deploy.path = "."
pre_deploy.command = """
set -eu
docker network inspect rclone_network >/dev/null 2>&1 || docker network create rclone_network
install -d -o [[PUID]] -g [[PGID]] -m 0700 \
  "[[APPDATA_DIR]]/rclone" \
  "[[TMP_DIR]]/rclone/cache"
chown [[PUID]]:[[PGID]] "[[APPDATA_DIR]]/rclone" "[[TMP_DIR]]/rclone/cache"
chmod 0700 "[[APPDATA_DIR]]/rclone" "[[TMP_DIR]]/rclone/cache"
if [ ! -f "[[APPDATA_DIR]]/rclone/rclone.conf" ]; then
  install -o [[PUID]] -g [[PGID]] -m 0600 /dev/null "[[APPDATA_DIR]]/rclone/rclone.conf"
fi
chown [[PUID]]:[[PGID]] "[[APPDATA_DIR]]/rclone/rclone.conf"
chmod 0600 "[[APPDATA_DIR]]/rclone/rclone.conf"
docker run --rm \
  --entrypoint /bin/sh \
  --user [[PUID]]:[[PGID]] \
  -v "[[APPDATA_DIR]]/rclone:/config/rclone" \
  -v "[[TMP_DIR]]/rclone/cache:/cache" \
  rclone/rclone:1.75.0 \
  -ec 'tmp="/config/rclone/.write-test.$$"; trap "rm -f \"$tmp\" \"$tmp.old\" /cache/.write-test" EXIT; test -r /config/rclone/rclone.conf; test -w /config/rclone/rclone.conf; touch "$tmp"; mv "$tmp" "$tmp.old"; touch /cache/.write-test'
"""
pre_deploy.shell_mode = true
environment = """
PUID = [[PUID]]
PGID = [[PGID]]
TZ = [[TZ]]
RCLONE_CONFIG_DIR = [[APPDATA_DIR]]/rclone
RCLONE_CACHE_DIR = [[TMP_DIR]]/rclone/cache
RCLONE_DATA_DIR = [[DATA_DIR]]
"""

[[stack]]
name = "caddy"
description = "Caddy reverse proxy"
deploy = true
after = ["sonarr", "radarr", "prowlarr", "adguard", "plex", "gluetun", "qbittorrent", "rclone"]
tags = ["infra", "proxy"]

[stack.config]
server = "atlas"
repo = "pjan/atlas"
branch = "main"
project_name = "caddy"
run_directory = "stacks/caddy"
file_paths = ["compose.yaml"]
auto_pull = true
poll_for_updates = true
links = ["http://caddy.atlas.local"]
config_files = [
  { path = "conf/Caddyfile", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/adguard.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/caddy.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/komodo.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/plex.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/qbittorrent.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/rclone.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/sonarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/radarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/prowlarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/ugos.caddy", services = ["caddy"], requires = "Restart" },
]
pre_deploy.path = "."
pre_deploy.shell_mode = true
pre_deploy.command = """
for network in media_network proxy_network rclone_network; do docker network inspect "$network" >/dev/null 2>&1 || docker network create "$network"; done
HTTP_BIND_IP=[[NAS_LAN_IP]] HTTP_PORT=[[HTTP_PORT]] docker compose -f compose.yaml pull caddy
HTTP_BIND_IP=[[NAS_LAN_IP]] HTTP_PORT=[[HTTP_PORT]] docker compose -f compose.yaml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
"""
post_deploy.path = "."
post_deploy.shell_mode = true
post_deploy.command = """
for i in 1 2 3 4 5; do
  docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile && break
  sleep 2
done
docker compose exec -T caddy wget -qO- http://127.0.0.1:2019/config/apps/http/servers/srv0/routes
"""
environment = """
HTTP_BIND_IP = [[NAS_LAN_IP]]
HTTP_PORT = [[HTTP_PORT]]
RCLONE_BASIC_AUTH_USER = [[RCLONE_BASIC_AUTH_USER]]
RCLONE_BASIC_AUTH_HASH = [[RCLONE_BASIC_AUTH_HASH]]
"""
