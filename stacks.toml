[[stack]]
name = "caddy"
description = "Caddy reverse proxy"
deploy = true
after = ["sonarr", "radarr", "prowlarr", "lidarr", "adguard", "uptime-kuma", "plex", "seerr", "gluetun", "qbittorrent", "sabnzbd", "rclone", "speedtest-tracker", "homepage"]
tags = ["infra", "proxy"]

[stack.config]
server = "atlas"
repo = "pjan/atlas"
branch = "main"
project_name = "caddy"
run_directory = "stacks/caddy"
file_paths = ["compose.yaml"]
auto_pull = true
poll_for_updates = true
links = ["http://caddy.atlas.local"]
config_files = [
  { path = "conf/Caddyfile", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/adguard.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/caddy.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/homepage.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/komodo.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/plex.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/qbittorrent.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/rclone.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/sabnzbd.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/seerr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/sonarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/speedtest-tracker.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/radarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/prowlarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/lidarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/uptime-kuma.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/ugos.caddy", services = ["caddy"], requires = "Restart" },
]
pre_deploy.path = "."
pre_deploy.shell_mode = true
pre_deploy.command = """
for network in media_network proxy_network rclone_network; do docker network inspect "$network" >/dev/null 2>&1 || docker network create "$network"; done
HTTP_BIND_IP=[[NAS_LAN_IP]] HTTP_PORT=[[HTTP_PORT]] docker compose -f compose.yaml pull caddy
HTTP_BIND_IP=[[NAS_LAN_IP]] HTTP_PORT=[[HTTP_PORT]] docker compose -f compose.yaml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
"""
post_deploy.path = "."
post_deploy.shell_mode = true
post_deploy.command = """
for i in 1 2 3 4 5; do
  docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile && break
  sleep 2
done
docker compose exec -T caddy wget -qO- http://127.0.0.1:2019/config/apps/http/servers/srv0/routes
"""
environment = """
HTTP_BIND_IP = [[NAS_LAN_IP]]
HTTP_PORT = [[HTTP_PORT]]
RCLONE_BASIC_AUTH_USER = [[RCLONE_BASIC_AUTH_USER]]
RCLONE_BASIC_AUTH_HASH = [[RCLONE_BASIC_AUTH_HASH]]
"""
