### VARIABLES ###

[[variable]]
name = "APPDATA_DIR"
value = "/volume2/appdata"

[[variable]]
name = "DATA_DIR"
value = "/volume1/data"

[[variable]]
name = "TMP_DIR"
value = "/volume2/tmp"

[[variable]]
name = "PUID"
value = "999"

[[variable]]
name = "PGID"
value = "10"

[[variable]]
name = "TZ"
value = "Etc/UTC"

[[variable]]
name = "NAS_LAN_IP"
value = "192.168.2.200"

[[variable]]
name = "HTTP_PORT"
value = "80"

[[variable]]
name = "PROTONVPN_SERVER_COUNTRIES"
value = "Netherlands"

[[variable]]
name = "PROTONVPN_PORT_FORWARD_ONLY"
value = "on"

[[variable]]
name = "PROTONVPN_VPN_PORT_FORWARDING"
value = "on"

[[variable]]
name = "SPOTTARR_USENET_PORT"
value = "563"

[[variable]]
name = "SPOTTARR_USENET_USE_TLS"
value = "true"

[[variable]]
name = "SPOTTARR_USENET_MAX_CONNECTIONS"
value = "5"

[[variable]]
name = "SPOTTARR_SPOTNET_RETRIEVE_AFTER"
value = "2026-01-01T00:00:00Z"

[[variable]]
name = "SPOTTARR_SPOTNET_IMPORT_BATCH_SIZE"
value = "5000"

[[variable]]
name = "SPOTTARR_SPOTNET_RETENTION_DAYS"
value = "365"

[[variable]]
name = "SPOTTARR_SPOTNET_IMPORT_ADULT_CONTENT"
value = "false"

[[variable]]
name = "SPEEDTEST_TRACKER_SCHEDULE"
value = "6 */6 * * *"

[[variable]]
name = "SPEEDTEST_TRACKER_SERVERS"
# Explicit nearby Ookla server IDs (Singapore). Empty auto-select is broken in
# speedtest-tracker 1.15.0 (SelectSpeedtestServerJob passes "" to an int-typed
# updateServerId -> TypeError, scheduled tests fail). The job picks one at random
# per run, so multiple IDs give rotation + resilience. Revert to "" once upstream
# adds an empty-guard. IDs: 7311 M1, 67827 FPT, 13623 Singtel, 5935 MyRepublic,
# 31293 Pacific Internet.
value = "7311,67827,13623,5935,31293"

[[variable]]
name = "SPEEDTEST_TRACKER_PRUNE_RESULTS_OLDER_THAN"
value = "365"

[[variable]]
name = "KOMETA_TIMES"
value = "04:30"

### STACKS ###

[[stack]]
name = "sonarr"
description = "sonarr"
deploy = true
after = ["gluetun"]
tags = ["media"]

[stack.config]
server = "atlas"
repo = "pjan/atlas"
branch = "main"
run_directory = "stacks/sonarr"
file_paths = ["compose.yaml"]
extra_args = ["--force-recreate"]
auto_pull = true
poll_for_updates = true
links = ["http://sonarr.atlas.local"]
pre_deploy.path = "."
pre_deploy.command = """
set -eu
sh ../../scripts/wait-for-container-health.sh gluetun 180
sh ../../scripts/atlas-hostfs.sh ensure-dir \
  "[[APPDATA_DIR]]/sonarr" [[PUID]] [[PGID]] 0750
sh ../../scripts/atlas-hostfs.sh ensure-shared-dir \
  "[[DATA_DIR]]/media/tv" [[PUID]] [[PGID]] 2775
for path in \
  "[[DATA_DIR]]/downloads/torrents/completed/tv" \
  "[[DATA_DIR]]/downloads/usenet/completed/tv"; do
  sh ../../scripts/atlas-hostfs.sh ensure-dir \
    "$path" [[PUID]] [[PGID]] 2775
done
"""
pre_deploy.shell_mode = true
environment = """
PUID = [[PUID]]
PGID = [[PGID]]
TZ = [[TZ]]
UMASK = 002
CONFIG_DIR = [[APPDATA_DIR]]/sonarr
DATA_DIR = [[DATA_DIR]]
"""

