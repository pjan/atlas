### VARIABLES ###

[[variable]]
name = "APPDATA_DIR"
value = "/volume2/appdata"

[[variable]]
name = "DATA_DIR"
value = "/volume1/data"

[[variable]]
name = "PUID"
value = "999"

[[variable]]
name = "PGID"
value = "10"

[[variable]]
name = "TZ"
value = "Etc/UTC"

[[variable]]
name = "NAS_LAN_IP"
value = "192.168.2.200"

[[variable]]
name = "HTTP_PORT"
value = "80"

### STACKS ###

[[stack]]
name = "sonarr"
description = "sonarr"
deploy = true
tags = ["media"]

[stack.config]
server = "atlas"
repo = "pjan/atlas"
branch = "main"
run_directory = "stacks/sonarr"
file_paths = ["compose.yaml"]
auto_pull = true
poll_for_updates = true
links = ["http://sonarr.atlas.local"]
pre_deploy.path = "."
pre_deploy.command = """for network in media_network proxy_network; do docker network inspect "$network" >/dev/null 2>&1 || docker network create "$network"; done"""
pre_deploy.shell_mode = true
environment = """
PUID = [[PUID]]
PGID = [[PGID]]
TZ = [[TZ]]
UMASK = 002
CONFIG_DIR = [[APPDATA_DIR]]/sonarr
DATA_DIR = [[DATA_DIR]]
"""

