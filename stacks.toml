[[stack]]
name = "kometa"
description = "Kometa Plex metadata and collection automation"
deploy = true
after = ["plex"]
tags = ["media", "automation"]

[stack.config]
server = "atlas"
repo = "pjan/atlas"
branch = "main"
run_directory = "stacks/kometa"
file_paths = ["compose.yaml"]
auto_pull = true
poll_for_updates = true
config_files = [
  { path = "config/config.yml", services = ["kometa"], requires = "Redeploy" },
  { path = "config/collections/movies.yml", services = ["kometa"], requires = "Redeploy" },
  { path = "config/collections/tv.yml", services = ["kometa"], requires = "Redeploy" },
]
pre_deploy.path = "."
pre_deploy.command = """
set -eu
sh ../../scripts/ensure-docker-network.sh media_network
sh ../../scripts/atlas-hostfs.sh ensure-dir \
  "[[APPDATA_DIR]]/kometa" [[PUID]] [[PGID]] 0750
sh ../../scripts/atlas-hostfs.sh ensure-dir \
  "[[APPDATA_DIR]]/kometa/collections" [[PUID]] [[PGID]] 0750
sh ../../scripts/atlas-hostfs.sh ensure-dir \
  "[[APPDATA_DIR]]/kometa/assets" [[PUID]] [[PGID]] 0750
sh ../../scripts/atlas-hostfs.sh install-file \
  "config/config.yml" \
  "[[APPDATA_DIR]]/kometa/config.yml" \
  [[PUID]] [[PGID]] 0600
for collection_file in config/collections/*.yml; do
  sh ../../scripts/atlas-hostfs.sh install-file \
    "$collection_file" \
    "[[APPDATA_DIR]]/kometa/collections/$(basename "$collection_file")" \
    [[PUID]] [[PGID]] 0640
done
"""
pre_deploy.shell_mode = true
environment = """
PUID = [[PUID]]
PGID = [[PGID]]
TZ = [[TZ]]
