  "[[APPDATA_DIR]]/kometa/assets" [[PUID]] [[PGID]] 0750
sh ../../scripts/atlas-hostfs.sh install-file \
  "config/config.yml" \
  "[[APPDATA_DIR]]/kometa/config.yml" \
  [[PUID]] [[PGID]] 0600
