deploy = true
tags = ["infra", "proxy"]

[stack.config]
server = "atlas"
repo = "pjan/atlas"
branch = "main"
project_name = "caddy"
run_directory = "stacks/caddy"
file_paths = ["compose.yaml"]
auto_pull = true
poll_for_updates = true
config_files = [
  { path = "conf/Caddyfile", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/adguard.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/autobrr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/bazarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/caddy.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/homepage.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/houndarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/komodo.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/plex.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/qui.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/qbittorrent.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/rclone.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/sabnzbd.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/seerr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/slskd.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/sonarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/spottarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/speedtest-tracker.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/radarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/prowlarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/lidarr.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/uptime-kuma.caddy", services = ["caddy"], requires = "Restart" },
  { path = "conf/sites/ugos.caddy", services = ["caddy"], requires = "Restart" },
]
pre_deploy.path = "."
pre_deploy.shell_mode = true
pre_deploy.command = """
set -eu
sh ../../scripts/ensure-docker-network.sh media_network
sh ../../scripts/ensure-docker-network.sh proxy_network
sh ../../scripts/ensure-docker-network.sh rclone_network
HTTP_BIND_IP=[[NAS_LAN_IP]] HTTP_PORT=[[HTTP_PORT]] docker compose -f compose.yaml pull caddy
HTTP_BIND_IP=[[NAS_LAN_IP]] HTTP_PORT=[[HTTP_PORT]] docker compose -f compose.yaml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
"""
post_deploy.path = "."
post_deploy.shell_mode = true
post_deploy.command = """
set -eu

reloaded=false
for attempt in 1 2 3 4 5; do
  if docker compose exec -T caddy \
    caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
    reloaded=true
    break
  fi

  echo "Caddy reload attempt $attempt failed" >&2
  sleep 2
done

test "$reloaded" = true

expected_config=$(mktemp)
live_config=$(mktemp)
expected_hosts=$(mktemp)
trap 'rm -f "$expected_config" "$live_config" "$expected_hosts"' EXIT HUP INT TERM

docker compose exec -T caddy \
  caddy adapt --pretty --config /etc/caddy/Caddyfile --adapter caddyfile \
  > "$expected_config"
docker compose exec -T caddy \
  wget -qO- http://127.0.0.1:2019/config/ \
  > "$live_config"

grep -oE '[a-zA-Z0-9-]+\\.atlas\\.(local|vandaele\\.io)' "$expected_config" \
  | sort -u > "$expected_hosts"
test -s "$expected_hosts"

while IFS= read -r hostname; do
  grep -Fq "$hostname" "$live_config" || {
    echo "Caddy live config is missing expected hostname: $hostname" >&2
    exit 1
  }
done < "$expected_hosts"

echo "Caddy live-route verification passed for:"
cat "$expected_hosts"
"""
environment = """
HTTP_BIND_IP = [[NAS_LAN_IP]]
HTTP_PORT = [[HTTP_PORT]]
"""
